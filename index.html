<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><title>Highrise ULTRA | لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#03040a;--card:#0a0f1a;--border:#1a2333;--text:#f0f4ff;--primary:#5b8def;--success:#10b981;--danger:#f43f5e;--purple:#a855f7}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:radial-gradient(1200px 600px at 80% -10%,#1a2a4a 0%,transparent 60%),linear-gradient(180deg,#03040a,#050812);color:var(--text);margin:0}
.loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#03040a;display:flex;justify-content:center;align-items:center;z-index:10000}
.loader{width:70px;height:70px;border:5px solid var(--border);border-top:5px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.header{position:sticky;top:0;background:rgba(3,4,10,.8);backdrop-filter:blur(20px);padding:20px 35px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:100}
.container{padding:30px;max-width:1700px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-bottom:35px}
.stat-card{background:rgba(10,15,26,.6);padding:28px;border-radius:22px;border:1px solid var(--border)}
.stat-card p{margin:15px 0 0;font-size:42px;font-weight:900;background:linear-gradient(90deg,var(--primary),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap;background:rgba(10,15,26,.6);padding:12px;border-radius:18px;border:1px solid var(--border)}
.tabs button{padding:14px 28px;background:transparent;border:none;color:#94a3b8;cursor:pointer;border-radius:14px;font-weight:900;font-size:15px;position:relative}
.tabs button.active{background:linear-gradient(135deg,var(--primary),#3b82f6);color:white}
.notification-badge{position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:none;align-items:center;justify-content:center}
.card{background:rgba(10,15,26,.6);border:1px solid var(--border);padding:24px;margin:16px 0;border-radius:20px}
.btn{padding:13px 22px;border:none;border-radius:14px;cursor:pointer;margin:5px;font-weight:900}
.btn.green{background:linear-gradient(135deg,var(--success),#059669);color:#000}.btn.red{background:linear-gradient(135deg,var(--danger),#e11d48);color:white}.btn.blue{background:linear-gradient(135deg,var(--primary),#3b82f6);color:white}.btn.purple{background:linear-gradient(135deg,var(--purple),#9333ea);color:white}.btn.orange{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000}
input,textarea{width:100%;padding:15px;border-radius:14px;border:1px solid var(--border);background:#03040a;color:white;margin:12px 0;font-size:16px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:10000}
.modal-box{background:rgba(10,15,26,.9);border:1px solid var(--primary);padding:32px;border-radius:26px;width:90%;max-width:580px}
.toast{position:fixed;bottom:30px;right:30px;background:linear-gradient(90deg,var(--success),#059669);color:#000;padding:16px 24px;border-radius:16px;display:none;font-weight:900;z-index:9999}
.command-admin{display:flex;gap:10px;margin:8px 0}
.command-admin input{flex:1;margin:0}
.delete-cmd{background:var(--danger);border:none;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer}
.preview-img{max-width:300px;border-radius:12px;margin-top:10px}
.delete-update-btn{float:left;background:var(--danger);color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer}
.rating-card{display:flex;justify-content:space-between;align-items:center}
.stars{color:#fbbf24;font-size:20px}
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen"><div class="loader"></div></div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-box" id="modalContent"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, where, getDocs, getDoc, serverTimestamp, addDoc, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyC7nexX-dwj_IhYC5EaS-DU_YQeE6-acDw",authDomain: "game-af286.firebaseapp.com",projectId: "game-af286"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
const ADMIN_EMAIL = "alaaahmedsayd16@gmail.com";

const hideLoading = () => document.getElementById('loadingScreen').style.display='none';
function showToast(msg){const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function showModal(icon,title,content,actions){document.getElementById('modalContent').innerHTML=`<h3>${icon} ${title}</h3>${content}<div style="display:flex;gap:12px;justify-content:flex-end;margin-top:22px">${actions}</div>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}

onAuthStateChanged(auth, user => {
  if(!user) {
    document.getElementById('app').innerHTML = `<div style="padding:45px;text-align:center;max-width:460px;margin:100px auto;background:rgba(10,15,26,.7);border-radius:26px"><h1 style="color:var(--primary)">🔐 Highrise ULTRA</h1><input type="email" id="adminEmail" value="${ADMIN_EMAIL}"><input type="password" id="adminPass" placeholder="كلمة السر"><button class="btn blue" style="width:100%" onclick="adminLogin()">دخول</button></div>`;
    hideLoading();
    return;
  }
  if(user.email!== ADMIN_EMAIL){
    document.getElementById('app').innerHTML = `<div style="padding:45px;text-align:center"><h1>⛔ غير مصرح</h1><button class="btn red" onclick="logout()">خروج</button></div>`;
    hideLoading();
    return;
  }
  loadAdminPanel();
  hideLoading();
});

function loadAdminPanel(){
  document.getElementById('app').innerHTML = `
  <div class="header"><h1>Highrise ULTRA</h1><button class="btn red" onclick="logout()">خروج</button></div>
  <div class="container">
  <div class="stats"><div class="stat-card"><h3>👥 الحسابات</h3><p id="userCount">0</p></div><div class="stat-card"><h3>🤖 البوتات</h3><p id="botCount">0</p></div><div class="stat-card"><h3>📢 التحديثات</h3><p id="updateCount">0</p></div><div class="stat-card"><h3>⭐ التقييمات</h3><p id="ratingCount">0</p></div></div>
  <div class="tabs">
    <button class="active" onclick="showTab('users',this)">👥 المستخدمين</button>
    <button onclick="showTab('actionReq',this)">⚡ طلبات التشغيل <span class="notification-badge" id="actionBadge"></span></button>
    <button onclick="showTab('transferReq',this)">🔄 طلبات النقل <span class="notification-badge" id="transferBadge"></span></button>
    <button onclick="showTab('updates',this)">📢 التحديثات</button>
    <button onclick="showTab('ratings',this)">⭐ التقييمات</button>
  </div>
  <div id="users"></div><div id="actionReq" style="display:none"></div><div id="transferReq" style="display:none"></div><div id="updates" style="display:none"></div><div id="ratings" style="display:none"></div></div>`;
  loadUsers(); loadActionRequests(); loadTransferRequests(); loadUpdates(); loadRatings();
}

function loadUsers(){
  onSnapshot(collection(db,"users"),(snap)=>{
    document.getElementById('userCount').innerText=snap.size;
    let botCount = 0;
    let html='<h2>👥 ادارة المستخدمين</h2>';
    snap.forEach(d=>{const u=d.data(); if(u.botCode) botCount++;
      html+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><div><p><b>الاسم:</b> ${u.username}</p><p><b>الايميل:</b> ${u.email}</p><p><b>حالة البوت:</b> ${u.botStatus || 'متوقف'}</p><p><b>التحكم:</b> ${u.botAssigned ? '🎛️ مضاف للمستخدم' : 'غير مضاف'} ${u.botOnline ? '🟢 متصل' : ''}</p></div><div><button class="btn blue" onclick="openBotControlModal('${d.id}','${u.username}')">🤖 ارسال بوت + اوامر</button>${!u.banned?`<button class="btn orange" onclick="openBanModal('${d.id}','${u.email}')">🚫 حظر</button>`:`<button class="btn green" onclick="unbanUser('${d.id}')">✅ فك حظر</button>`}<button class="btn red" onclick="deleteUser('${d.id}')">🗑️ حذف</button></div></div>`;});
    document.getElementById('users').innerHTML=html;
    document.getElementById('botCount').innerText=botCount;
  });
}

window.openBotControlModal=async(uid,username)=>{
  const snap = await getDoc(doc(db,"users",uid));
  const data = snap.data();
  const commands = data.botCommands || [];
  let commandsHtml = `<h4>📜 اوامر البوت - اكتبها بالشكل: الامر - الشرح</h4><div id="cmdList">`;
  commands.forEach((c,i)=>{commandsHtml += `<div class="command-admin"><input value="${c}" id="cmd${i}"><button class="delete-cmd" onclick="deleteCommand('${uid}',${i})">🗑️</button></div>`});
  commandsHtml += `</div><div style="display:flex;gap:10px"><input id="newCommand" placeholder="مثال: br - للسحب"><button class="btn green" onclick="addCommand('${uid}')">اضافة</button></div>`;
  showModal('🤖',`تحكم في بوت ${username}`,`<p><b>معرف البوت:</b></p><input id="botControlId" value="${data.botControlId || 'main'}" placeholder="مثال: main"><p><b>كود البوت:</b></p><textarea id="botCodeEdit" style="min-height:200px">${data.botCode || ''}</textarea>${commandsHtml}`,`<button class="btn ghost" onclick="closeModal()">الغاء</button><button class="btn blue" onclick="saveBotCode('${uid}')">💾 ارسال البوت</button>`);
}

window.saveBotCode=async(uid)=>{const code=document.getElementById('botCodeEdit').value.trim();const botControlId=document.getElementById('botControlId').value.trim()||'main';if(!code)return showToast('حط الكود');await setDoc(doc(db,"users",uid),{botCode:code,botControlId,botAssigned:true,botStatus:'متوقف',botControlEnabled:false,botOnline:false,botRequestedAction:null},{merge:true});closeModal();showToast('✅ تم ارسال البوت للمستخدم')}
window.addCommand=async(uid)=>{const cmd=document.getElementById('newCommand').value.trim();if(!cmd)return;if(!cmd.includes(' - '))return showToast('لازم تكتب: الامر - الشرح');const snap=await getDoc(doc(db,"users",uid));let cmds=snap.data().botCommands||[];cmds.push(cmd);await updateDoc(doc(db,"users",uid),{botCommands:cmds});document.getElementById('newCommand').value='';showToast('تم اضافة الامر');}
window.deleteCommand=async(uid,index)=>{const snap=await getDoc(doc(db,"users",uid));let cmds=snap.data().botCommands||[];cmds.splice(index,1);await updateDoc(doc(db,"users",uid),{botCommands:cmds});showToast('تم مسح الامر');}
window.openBanModal=(uid,email)=>{showModal('🚫',`حظر: ${email}`,`<textarea id="banReason" placeholder="سبب الحظر"></textarea>`,`<button class="btn ghost" onclick="closeModal()">الغاء</button><button class="btn red" onclick="doBan('${uid}')">تأكيد</button>`);}
window.doBan=async(uid)=>{await updateDoc(doc(db,"users",uid),{banned:true,banReason:document.getElementById('banReason').value});closeModal();showToast('تم الحظر');}
window.unbanUser=async(uid)=>{await updateDoc(doc(db,"users",uid),{banned:false,banReason:null});showToast('تم فك الحظر');}
window.deleteUser=async(uid)=>{if(confirm('متأكد؟')){await deleteDoc(doc(db,"users",uid));showToast('تم الحذف')}}

function loadActionRequests(){
  onSnapshot(query(collection(db,"bot_action_requests"),where("status","==","pending")), async (snap)=>{
    document.getElementById('actionBadge').style.display = snap.size > 0? 'flex' : 'none';
    document.getElementById('actionBadge').innerText = snap.size;
    if(snap.size > 0) showToast(`🔔 ${snap.size} طلب تشغيل جديد`);

    let html='<h2>⚡ طلبات التشغيل/الايقاف</h2>';
    for(const d of snap.docs){const r=d.data();
      html+=`<div class="card" style="display:flex;justify-content:space-between"><div><p><b>المستخدم:</b> ${r.username}</p><p><b>الطلب:</b> ${r.action==='start'?'تشغيل':'ايقاف'}</p></div><div><button class="btn green" onclick="approveAction('${d.id}','${r.uid}','${r.action}')">✅ موافقة</button><button class="btn red" onclick="rejectAction('${d.id}','${r.uid}')">❌ رفض</button></div></div>`;
    }
    document.getElementById('actionReq').innerHTML=html||'<p>لا توجد طلبات</p>';
  });
}
window.approveAction=async(reqId,uid,action)=>{const newStatus=action==='start'?'شغال':'متوقف';await updateDoc(doc(db,"users",uid),{botStatus:newStatus,botControlEnabled:action==='start',botRequestedAction:null});await updateDoc(doc(db,"bot_action_requests",reqId),{status:'approved',approvedAt:serverTimestamp()});showToast(action==='start'?'🟢 تم تشغيل البوت':'🔴 تم إيقاف البوت');}
window.rejectAction=async(reqId,uid)=>{const userSnap=await getDoc(doc(db,"users",uid));const current=userSnap.data()||{};const currentStatus=current.botStatus==='بانتظار الموافقة' ? (current.botControlEnabled?'شغال':'متوقف') : (current.botStatus||'متوقف');await updateDoc(doc(db,"users",uid),{botStatus:currentStatus,botRequestedAction:null});await updateDoc(doc(db,"bot_action_requests",reqId),{status:'rejected',rejectedAt:serverTimestamp()});showToast('❌ تم رفض الطلب');}

function loadTransferRequests(){
  onSnapshot(query(collection(db,"bot_transfer_requests"),where("status","==","pending")), async (snap)=>{
    document.getElementById('transferBadge').style.display = snap.size > 0? 'flex' : 'none';
    document.getElementById('transferBadge').innerText = snap.size;
    if(snap.size > 0) showToast(`🔔 ${snap.size} طلب نقل جديد`);

    let html='<h2>🔄 طلبات نقل البوت</h2>';
    for(const d of snap.docs){const r=d.data();
      html+=`<div class="card" style="display:flex;justify-content:space-between"><div><p><b>المستخدم:</b> ${r.username}</p><p><b>كود الغرفه:</b> ${r.roomCode}</p></div><div><button class="btn green" onclick="approveTransfer('${d.id}','${r.uid}','${r.roomCode}')">✅ موافقة</button><button class="btn red" onclick="rejectTransfer('${d.id}')">❌ رفض</button></div></div>`;
    }
    document.getElementById('transferReq').innerHTML=html||'<p>لا توجد طلبات</p>';
  });
}
window.approveTransfer=async(reqId,uid,roomCode)=>{await updateDoc(doc(db,"users",uid),{roomCode:roomCode,botStatus:'متوقف'});await updateDoc(doc(db,"bot_transfer_requests",reqId),{status:'approved'});showToast('تمت الموافقة');}
window.rejectTransfer=async(reqId)=>{await updateDoc(doc(db,"bot_transfer_requests",reqId),{status:'rejected'});showToast('تم الرفض');}

function loadRatings(){
  onSnapshot(query(collection(db,"ratings"),orderBy("time","desc")),(snap)=>{
    document.getElementById('ratingCount').innerText=snap.size;
    let html='<h2>⭐ تقييمات المستخدمين</h2>';
    snap.forEach(d=>{const r=d.data();
      let stars = '⭐'.repeat(r.rating);
      let emoji = {1:'😢',2:'😕',3:'🙂',4:'😄',5:'🥳'}[r.rating];
      html+=`<div class="card rating-card"><div><p><b>${r.username}</b></p><p style="color:#aaa;font-size:14px">${new Date(r.time?.toDate()).toLocaleString('ar-EG')}</p></div><div><span class="stars">${stars}</span> ${emoji}</div></div>`;
    });
    document.getElementById('ratings').innerHTML=html||'<p>لا توجد تقييمات</p>';
  });
}

function loadUpdates(){
  onSnapshot(query(collection(db,"updates"),orderBy("time","desc")),(snap)=>{
    document.getElementById('updateCount').innerText=snap.size;
    let html='<h2>📢 ارسال تحديث</h2><div class="card"><input id="updateText" placeholder="نص التحديث"><input type="file" id="updateImageFile" accept="image/*"><img id="imagePreview" class="preview-img" style="display:none"><button class="btn purple" onclick="sendUpdate()">نشر</button></div><h2>السابقة</h2>';
    snap.forEach(d=>{const u=d.data();html+=`<div class="card"><button class="delete-update-btn" onclick="deleteUpdate('${d.id}')">مسح</button><p><b>${u.username}:</b> ${u.text}</p>${u.image?`<img src="${u.image}" style="max-width:300px;border-radius:12px">`:''}</div>`;});
    document.getElementById('updates').innerHTML=html;
    const fileInput=document.getElementById('updateImageFile');if(fileInput){fileInput.onchange=(e)=>{const file=e.target.files[0];if(file){const reader=new FileReader();reader.onload=(e)=>{document.getElementById('imagePreview').src=e.target.result;document.getElementById('imagePreview').style.display='block'};reader.readAsDataURL(file);}}}
  });
}
window.sendUpdate=async()=>{const text=document.getElementById('updateText').value.trim();const file=document.getElementById('updateImageFile').files[0];if(!text&&!file)return showToast('لازم نص او صوره');let imageData=null;if(file){imageData=await toBase64(file);}await addDoc(collection(db,"updates"),{username:"الادارة",text:text,image:imageData||null,reactions:{},time:serverTimestamp()});document.getElementById('updateText').value='';document.getElementById('updateImageFile').value='';document.getElementById('imagePreview').style.display='none';showToast('تم النشر');}
function toBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.readAsDataURL(file);reader.onload=()=>resolve(reader.result);reader.onerror=error=>reject(error);})}
window.deleteUpdate=async(id)=>{if(confirm('متأكد؟')){await deleteDoc(doc(db,"updates",id));showToast('تم المسح');}}

window.showTab=(t,btn)=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['users','actionReq','transferReq','updates','ratings'].forEach(id=>document.getElementById(id).style.display=id==t?'block':'none');}
window.adminLogin=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('adminEmail').value,document.getElementById('adminPass').value);showToast('تم الدخول');}catch(e){showToast('بيانات خاطئة');hideLoading();}}
window.logout=()=>signOut(auth);
</script>
</body>
</html>
