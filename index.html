<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><title>Highrise ULTRA | لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#03040a;--card:#0a0f1a;--border:#1a2333;--text:#f0f4ff;--primary:#5b8def;--success:#10b981;--danger:#f43f5e;--warn:#f59e0b;--purple:#a855f7}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:radial-gradient(1200px 600px at 80% -10%,#1a2a4a 0%,transparent 60%),linear-gradient(180deg,#03040a,#050812);color:var(--text);margin:0;padding:0}
.header{position:sticky;top:0;background:rgba(3,4,10,.7);backdrop-filter:blur(20px);padding:18px 30px;border-bottom:1px solid var(--border);z-index:100;display:flex;justify-content:space-between;align-items:center}
.header h1{color:var(--primary);font-weight:900;margin:0;font-size:24px;letter-spacing:.5px}
.header h1 span{color:var(--text);font-weight:600}
.container{padding:30px;max-width:1700px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-bottom:35px}
.stat-card{background:rgba(10,15,26,.6);backdrop-filter:blur(10px);border:1px solid var(--border);padding:28px;border-radius:22px;transition:.4s;position:relative;overflow:hidden;animation:fadeUp.5s}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--primary),var(--purple))}
.stat-card:hover{transform:translateY(-8px);border-color:var(--primary);box-shadow:0 15px 50px rgba(91,141,239,.25)}
.stat-card h3{margin:0;font-size:15px;color:#94a3b8;font-weight:600;display:flex;align-items:center;gap:8px}
.stat-card p{margin:15px 0 0;font-size:42px;font-weight:900;background:linear-gradient(90deg,var(--primary),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap;background:rgba(10,15,26,.6);backdrop-filter:blur(10px);padding:12px;border-radius:18px;border:1px solid var(--border)}
.tabs button{padding:13px 26px;background:transparent;border:none;color:#94a3b8;cursor:pointer;border-radius:14px;font-weight:700;transition:.3s;font-size:15px;position:relative}
.tabs button:hover{color:var(--text);background:rgba(91,141,239,.12)}
.tabs button.active{background:linear-gradient(135deg,var(--primary),#3b82f6);color:white;box-shadow:0 6px 25px rgba(91,141,239,.5)}
/* اشعار التاب */
.tab-badge{position:absolute;top:-5px;left:-5px;background:var(--danger);color:white;font-size:11px;font-weight:900;border-radius:50%;width:22px;height:22px;display:none;align-items:center;justify-content:center;box-shadow:0 0 10px rgba(244,63,94,.8);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.card{background:rgba(10,15,26,.6);backdrop-filter:blur(10px);border:1px solid var(--border);padding:22px;margin:16px 0;border-radius:20px;transition:.3s}
.card:hover{border-color:var(--primary)}
.btn{padding:12px 20px;border:none;border-radius:14px;cursor:pointer;margin:5px;font-weight:800;transition:.25s;font-size:14px}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.btn.green{background:var(--success);color:#000}.btn.red{background:var(--danger);color:white}.btn.blue{background:var(--primary);color:white}.btn.orange{background:var(--warn);color:#000}.btn.purple{background:var(--purple);color:white}.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.toast{position:fixed;bottom:30px;right:30px;background:var(--success);color:#000;padding:16px 24px;border-radius:16px;display:none;font-weight:800;z-index:9999;box-shadow:0 10px 40px rgba(16,185,129,.4);animation:slideIn.3s}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.login-box{background:rgba(10,15,26,.7);backdrop-filter:blur(20px);padding:45px;border-radius:26px;max-width:460px;margin:100px auto;border:1px solid var(--border);text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.6)}
input{width:100%;padding:15px;border-radius:14px;border:1px solid var(--border);background:#03040a;color:white;margin:12px 0;font-size:16px}
input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,141,239,.2)}
.req-item{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.req-info{flex:1}
a{color:var(--primary);word-break:break-all}
.user-actions{display:flex;gap:10px;flex-wrap:wrap}
.badge{padding:7px 14px;border-radius:22px;font-size:12px;font-weight:800}
.badge.pending{background:rgba(245,158,11,.15);color:var(--warn);border:1px solid var(--warn)}.badge.on{background:rgba(16,185,129,.15);color:var(--success);border:1px solid var(--success)}.badge.off{background:rgba(244,63,94,.15);color:var(--danger);border:1px solid var(--danger)}.badge.mod{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid var(--purple)}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);display:none;justify-content:center;align-items:center;z-index:10000;animation:fadeIn.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:rgba(10,15,26,.9);backdrop-filter:blur(20px);border:1px solid var(--primary);padding:32px;border-radius:26px;width:90%;max-width:580px;box-shadow:0 25px 90px rgba(91,141,239,.4)}
.modal-box h3{margin-top:0;color:var(--primary);font-size:23px;display:flex;align-items:center;gap:12px}
.modal-box textarea{width:100%;min-height:110px;background:#03040a;border:1px solid var(--border);color:white;border-radius:14px;padding:14px;margin:18px 0;font-family:'Cairo'}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:22px}
.chat-admin{max-height:420px;overflow-y:auto;background:#03040a;padding:18px;border-radius:14px;margin:18px 0;border:1px solid var(--border)}
.chat-msg{padding:12px;margin:10px 0;border-radius:12px}
.chat-msg.user{background:rgba(91,141,239,.15);margin-right:50px;border-right:3px solid var(--primary)}
.chat-msg.admin{background:rgba(168,85,247,.15);margin-left:50px;border-left:3px solid var(--purple)}
.send-to-user-box{background:#03040a;padding:18px;border-radius:14px;margin-bottom:22px;border:1px dashed var(--primary)}
.quick-replies{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.quick-reply-btn{background:rgba(91,141,239,.12);border:1px solid var(--primary);color:var(--primary);padding:9px 15px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:700}
.quick-reply-btn:hover{background:var(--primary);color:white}
.pro-table{width:100%;border-collapse:collapse;background:rgba(10,15,26,.6);backdrop-filter:blur(10px);border-radius:18px;overflow:hidden;border:1px solid var(--border)}
.pro-table th{background:linear-gradient(135deg,var(--primary),#3b82f6);color:white;padding:16px;text-align:right;font-weight:800;font-size:15px}
.pro-table td{padding:16px;border-bottom:1px solid var(--border);font-weight:600}
.pro-table tr:hover{background:rgba(91,141,239,.08)}
</style>
</head>
<body>
<div id="app">جاري التحميل...</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-box" id="modalContent"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, where, getDocs, serverTimestamp, addDoc, Timestamp, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyC7nexX-dwj_IhYC5EaS-DU_YQeE6-acDw",authDomain: "game-af286.firebaseapp.com",projectId: "game-af286"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
const ADMIN_EMAIL = "alaaahmedsayd16@gmail.com";

const QUICK_REPLIES = ["سوف يتم الرد عليك في اقرب وقت 🌹","تم استلام طلبك وجاري المراجعة","ممكن توضح المشكلة اكتر؟","تم حل المشكلة بنجاح ✅","شكراً لتواصلك معنا"];

function showToast(msg){const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function showModal(icon,title,content,actions){document.getElementById('modalContent').innerHTML=`<h3>${icon} ${title}</h3>${content}<div class="modal-actions">${actions}</div>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function getDurationMs(duration){if(duration==="24 ساعة") return 24*60*60*1000;if(duration==="اسبوع") return 7*24*60*60*1000;if(duration==="شهر") return 30*24*60*60*1000;return 12*60*60*1000;}

// دالة تجيب اسم و ايميل اليوزر
async function getUserInfo(uid) {
  if(!uid) return {username:'غير معروف', email:'-'};
  const userSnap = await getDocs(query(collection(db,"users"), where("__name__","==",uid)));
  if(userSnap.empty) return {username:'مستخدم محذوف', email:'-'};
  const data = userSnap.docs[0].data();
  return {username: data.username || 'بدون اسم', email: data.email || '-'};
}

// دالة تحديث اشعارات التابات
function updateTabBadge(tabId, count){
  const btn = document.querySelector(`button[onclick*="'${tabId}'"]`);
  if(!btn) return;
  let badge = btn.querySelector('.tab-badge');
  if(!badge){
    badge = document.createElement('span');
    badge.className = 'tab-badge';
    btn.appendChild(badge);
  }
  if(count > 0){
    badge.style.display = 'flex';
    badge.innerText = count;
  }else{
    badge.style.display = 'none';
  }
}

onAuthStateChanged(auth, user => {
  const appDiv = document.getElementById('app');
  if(!user) {
    appDiv.innerHTML = `<div class="login-box"><h1 style="background:linear-gradient(90deg,var(--primary),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent">🔐 Highrise ULTRA</h1><input type="email" id="adminEmail" placeholder="ايميل الادمن" value="${ADMIN_EMAIL}"><input type="password" id="adminPass" placeholder="كلمة السر"><button class="btn blue" style="width:100%;margin-top:12px" onclick="adminLogin()">دخول</button></div>`;
    return;
  }
  if(user.email!== ADMIN_EMAIL){appDiv.innerHTML = `<div class="login-box"><h1>⛔ غير مصرح</h1><button class="btn red" onclick="logout()">خروج</button></div>`; return;}
  loadAdminPanel();
});

function loadAdminPanel(){
  document.getElementById('app').innerHTML = `
  <div class="header"><h1>Highrise <span>ULTRA</span></h1><button class="btn red" onclick="logout()">خروج</button></div>
  <div class="container">
  <div class="stats">
    <div class="stat-card"><h3>👥 اجمالي الحسابات</h3><p id="userCount">0</p></div>
    <div class="stat-card"><h3>🖥️ السيرفرات النشطة</h3><p id="serverCount">0</p></div>
    <div class="stat-card"><h3>🤖 البوتات المشغلة</h3><p id="botCount">0</p></div>
  </div>
  <div class="tabs">
    <button class="active" onclick="showTab('users',this)">👥 المستخدمين<span class="tab-badge"></span></button>
    <button onclick="showTab('servers',this)">🖥️ السيرفرات</button>
    <button onclick="showTab('bots',this)">🤖 البوتات</button>
    <button onclick="showTab('support',this)">💬 الدعم الفني<span class="tab-badge"></span></button>
    <button onclick="showTab('modReq',this)">🛡️ طلبات اشراف<span class="tab-badge"></span></button>
    <button onclick="showTab('botReq',this)">🤖 طلبات بوتات<span class="tab-badge"></span></button>
    <button onclick="showTab('apiBotReq',this)">⚡ طلبات بوت API<span class="tab-badge"></span></button>
    <button onclick="showTab('actionReq',this)">⚡ طلبات تشغيل<span class="tab-badge"></span></button>
    <button onclick="showTab('linkReq',this)">🔗 طلبات روابط<span class="tab-badge"></span></button>
    <button onclick="showTab('deleteReq',this)">🗑️ طلبات حذف<span class="tab-badge"></span></button>
  </div>
  <div id="users"></div><div id="servers" style="display:none"></div><div id="bots" style="display:none"></div>
  <div id="support" style="display:none"></div><div id="modReq" style="display:none"></div>
  <div id="botReq" style="display:none"></div><div id="apiBotReq" style="display:none"></div>
  <div id="actionReq" style="display:none"></div><div id="linkReq" style="display:none"></div><div id="deleteReq" style="display:none"></div>
  </div>`;
  loadUsers(); loadServers(); loadBots(); loadSupport(); loadModRequests(); loadBotRequests(); loadAPIBotRequests(); loadActionRequests(); loadLinkRequests(); loadDeleteRequests();
}

// اشعار المستخدمين الجدد
function loadUsers(){
  onSnapshot(collection(db,"users"),(snap)=>{
    document.getElementById('userCount').innerText=snap.size;
    // عد المستخدمين اللي لسه جداد ومفيش isRead
    const newUsers = snap.docs.filter(d =>!d.data().isReadByAdmin).length;
    updateTabBadge('users', newUsers);

    let html='<h2>👥 ادارة المستخدمين</h2>';
    snap.forEach(d=>{const u=d.data();
      html+=`<div class="card req-item"><div class="req-info"><p><b>الاسم:</b> ${u.username || 'بدون'} ${u.isModerator?'<span class="badge mod">🛡️ مشرف</span>':''}</p><p><b>الايميل:</b> ${u.email}</p><p><b>الحالة:</b> ${u.banned?`<span class="badge" style="background:rgba(244,63,94,.15);color:var(--danger);border:1px solid var(--danger)">🔨 محظور</span>`:`<span class="badge" style="background:rgba(16,185,129,.15);color:var(--success);border:1px solid var(--success)">✅ فعال</span>`}</p></div><div class="user-actions">${u.isModerator?`<button class="btn purple" onclick="revokeMod('${d.id}')">⛔ الغاء اشراف</button>`:''}${!u.banned?`<button class="btn orange" onclick="openWarnModal('${d.id}','${u.email}')">⚠️ تحذير</button><button class="btn red" onclick="openBanModal('${d.id}','${u.email}')">🚫 حظر</button>`:`<button class="btn green" onclick="unbanUser('${d.id}')">✅ فك حظر</button>`}<button class="btn red" onclick="openDeleteUserModal('${d.id}','${u.email}')">🗑️ حذف</button></div></div>`;});
    document.getElementById('users').innerHTML=html||'<p>لا يوجد مستخدمين</p>';
  });
}

// اشعار الدعم الفني
function loadSupport(){
  onSnapshot(query(collection(db,"support_messages"),where("read","==",false), where("sender","==","user")),(snap)=>{
    updateTabBadge('support', snap.size);
  });

  onSnapshot(query(collection(db,"support_messages"),orderBy("time","asc")),(snap)=>{
    let html='<h2>💬 مركز الدعم الفني</h2>';
    html += `<div class="send-to-user-box"><h3>📨 ارسال رسالة مباشرة</h3><input id="targetUsername" placeholder="اسم المستخدم"><textarea id="targetMessage" placeholder="نص الرسالة"></textarea><div class="quick-replies">${QUICK_REPLIES.map(r=>`<button class="quick-reply-btn" onclick="useQuickReply('targetMessage','${r}')">${r.substring(0,18)}...</button>`).join('')}</div><button class="btn purple" onclick="sendToAnyUser()">ارسال</button></div>`;
    const users = {}; snap.forEach(d=>{const m=d.data(); if(!users[m.uid]) users[m.uid]=[]; users[m.uid].push({id:d.id,...m});});
    for(const uid in users){
      html+=`<div class="card"><h3>${users[uid][0].username}</h3><div class="user-actions"><button class="btn red" onclick="openDeleteChatModal('${uid}','${users[uid][0].username}')">🗑️ مسح المحادثة</button></div><div class="chat-admin">`;
      users[uid].forEach(m=>{html+=`<div class="chat-msg ${m.sender}"><b>${m.sender==='user'?users[uid][0].username:'الإدارة'}:</b><br>${m.text}</div>`});
      html+=`</div><input id="reply${uid}" placeholder="رد..."><div class="quick-replies">${QUICK_REPLIES.map(r=>`<button class="quick-reply-btn" onclick="useQuickReply('reply${uid}','${r}')">نسخ</button>`).join('')}</div><button class="btn purple" style="margin-top:10px" onclick="replyUser('${uid}')">ارسال</button></div>`;
    }
    document.getElementById('support').innerHTML=html||'<p>لا توجد رسائل</p>';
  });
}

window.useQuickReply=(inputId,text)=>{document.getElementById(inputId).value = text;navigator.clipboard.writeText(text);showToast('تم النسخ 📋');}
window.sendToAnyUser=async()=>{const username = document.getElementById('targetUsername').value.trim();const message = document.getElementById('targetMessage').value.trim();if(!username ||!message) return showToast('اكمل البيانات');const usersSnap = await getDocs(query(collection(db,"users"),where("username","==",username)));if(usersSnap.empty) return showToast('❌ غير موجود');await addDoc(collection(db,"support_messages"),{uid: usersSnap.docs[0].id, username, text: message, sender: "admin", read: true, time: serverTimestamp()});document.getElementById('targetUsername').value='';document.getElementById('targetMessage').value='';showToast(`✅ تم الارسال لـ ${username}`);}
window.replyUser=async(uid)=>{const msg=document.getElementById(`reply${uid}`).value.trim();if(!msg)return;await addDoc(collection(db,"support_messages"),{uid,username:"الادارة",text:msg,sender:"admin",read:true,time:serverTimestamp()});document.getElementById(`reply${uid}`).value='';showToast('تم الرد');}
window.openDeleteChatModal=(uid,username)=>{showModal('🗑️',`مسح محادثة ${username}`,`<p style="color:var(--danger)">تحذير: سيتم مسح كل الرسائل نهائياً</p>`,`<button class="btn ghost" onclick="closeModal()">الغاء</button><button class="btn red" onclick="deleteChat('${uid}')">تأكيد</button>`);}
window.deleteChat=async(uid)=>{const msgs = await getDocs(query(collection(db,"support_messages"),where("uid","==",uid)));msgs.forEach(m=>deleteDoc(doc(db,"support_messages",m.id)));closeModal();showToast('🗑️ تم المسح');}

// باقي الطلبات كلها
function loadModRequests(){
  onSnapshot(query(collection(db,"moderator_requests"),where("status","==","pending")), async (snap)=>{
    updateTabBadge('modReq', snap.size);
    let html='<h2>🛡️ طلبات الاشراف المعلقة</h2>';
    for(const d of snap.docs){const r=d.data(); const userInfo = await getUserInfo(r.uid);
      html+=`<div class="card req-item"><div class="req-info"><p><b>اسم الحساب:</b> ${userInfo.username}</p><p><b>الايميل:</b> ${userInfo.email}</p><p><b>السبب:</b> ${r.reason}</p><p><b>الخبرة:</b> ${r.exp}</p></div><div><button class="btn green" onclick="approveMod('${d.id}','${r.uid}')">✅ قبول</button><button class="btn red" onclick="rejectMod('${d.id}')">❌ رفض</button></div></div>`;}
    document.getElementById('modReq').innerHTML=html||'<p>لا توجد طلبات</p>';
  });
}
window.approveMod=async(id,uid)=>{await updateDoc(doc(db,"users",uid),{isModerator:true});await updateDoc(doc(db,"moderator_requests",id),{status:'approved'});showToast('تمت الترقية لمشرف');}
window.rejectMod=async(id)=>{await updateDoc(doc(db,"moderator_requests",id),{status:'rejected'});showToast('تم الرفض');}

function loadServers(){onSnapshot(collection(db,"servers"),(snap)=>{document.getElementById('serverCount').innerText=snap.size;let html='<h2>🖥️ ادارة السيرفرات</h2><table class="pro-table"><tr><th>اسم السيرفر</th><th>الحالة</th><th>النوع</th><th>المالك</th><th>اجراء</th></tr>';snap.forEach(d=>{const s=d.data();html+=`<tr><td>${s.name}</td><td><span class="badge ${s.status==='شغال'?'on':s.pendingAction?'pending':'off'}">${s.pendingAction||s.status}</span></td><td>${s.type==='python'?'بايثون':'Node.js'}</td><td>${s.uid}</td><td><button class="btn red" onclick="deleteServer('${d.id}')">حذف</button></td></tr>`});html+='</table>';document.getElementById('servers').innerHTML=html||'<p>لا توجد سيرفرات</p>';});}
window.deleteServer=async(id)=>{await deleteDoc(doc(db,"servers",id));showToast('تم الحذف')}

function loadBots(){onSnapshot(collection(db,"bots"), async (snap)=>{document.getElementById('botCount').innerText=snap.size;let html='<h2>🤖 ادارة البوتات</h2><table class="pro-table"><tr><th>اسم البوت</th><th>اسم الحساب</th><th>الحالة</th><th>المدة</th><th>اجراء</th></tr>';
  for(const d of snap.docs){const b=d.data(); const userInfo = await getUserInfo(b.uid);
    html+=`<tr><td>${b.name}</td><td>${userInfo.username}<br><small style="color:#94a3b8">${userInfo.email}</small></td><td><span class="badge ${b.status==='شغال'?'on':b.status==='جاهز'?'on':'pending'}">${b.status}</span></td><td>${b.duration||'API'}</td><td><button class="btn red" onclick="deleteBot('${d.id}')">حذف</button></td></tr>`;}
  html+='</table>';document.getElementById('bots').innerHTML=html||'<p>لا توجد بوتات</p>';});}
window.deleteBot=async(id)=>{await deleteDoc(doc(db,"bots",id));showToast('تم حذف البوت')}

function loadBotRequests(){
  onSnapshot(query(collection(db,"bot_requests"),where("status","==","pending")), async (snap)=>{
    updateTabBadge('botReq', snap.size);
    let html='<h2>🤖 طلبات البوتات العادية المعلقة</h2>';
    for(const d of snap.docs){const r=d.data(); const userInfo = await getUserInfo(r.uid);
      html+=`<div class="card req-item"><div class="req-info"><p><b>اسم الحساب:</b> ${userInfo.username}</p><p><b>الايميل:</b> ${userInfo.email}</p><p><b>البوت:</b> ${r.name}</p><p><b>المدة:</b> ${r.duration}</p><p><b>Token:</b> ${r.token}</p><p><b>الغرفة:</b> ${r.room}</p></div><div><button class="btn green" onclick="approveBot('${d.id}','${r.uid}','${r.name}','${r.duration}')">✅ موافقة</button><button class="btn red" onclick="rejectBot('${d.id}')">❌ رفض</button></div></div>`;}
    document.getElementById('botReq').innerHTML=html||'<p>لا توجد طلبات</p>';
  });
}
window.approveBot=async(reqId,userId,botName,duration)=>{const expires=new Date();expires.setTime(expires.getTime()+getDurationMs(duration));const botRef=await addDoc(collection(db,"bots"),{uid:userId,name:botName,status:"شغال",duration,createdAt:serverTimestamp(),expiresAt:Timestamp.fromDate(expires)});await updateDoc(doc(db,"bot_requests",reqId),{status:'approved',botId:botRef.id});await addDoc(collection(db,"notifications"),{uid:userId,reason:`تمت الموافقة على بوت ${botName} لمدة ${duration}`,type:"bot_approved",time:serverTimestamp()});showToast(`✅ تمت الموافقة`);}
window.rejectBot=async(reqId)=>{await updateDoc(doc(db,"bot_requests",reqId),{status:'rejected'});showToast('❌ تم الرفض');}

function loadAPIBotRequests(){
  onSnapshot(query(collection(db,"api_bot_requests"),where("status","==","pending")), async (snap)=>{
    updateTabBadge('apiBotReq', snap.size);
    let html='<h2>⚡ طلبات بوت API المعلقة</h2>';
    for(const d of snap.docs){const r=d.data(); const userInfo = await getUserInfo(r.uid);
      html+=`<div class="card req-item"><div class="req-info">
        <p><b>اسم الحساب في الموقع:</b> ${userInfo.username}</p>
        <p><b>الايميل:</b> ${userInfo.email}</p>
        <p><b>اسم الحساب في اللعبة:</b> ${r.gameName}</p>
        <p><b>اسم البوت المطلوب:</b> ${r.botName}</p>
      </div><div>
        <button class="btn green" onclick="openApproveAPIBotModal('${d.id}','${r.uid}','${r.botName}','${r.gameName}')">✅ موافقة وارسال الكود</button>
        <button class="btn red" onclick="rejectAPIBot('${d.id}')">❌ رفض</button>
      </div></div>`;}
    document.getElementById('apiBotReq').innerHTML=html||'<p>لا توجد طلبات</p>';
  });
}
window.openApproveAPIBotModal=(reqId,uid,botName,gameName)=>{
  showModal('⚡',`موافقة على بوت ${botName}`,`<p><b>اسم الحساب:</b> ${gameName}</p><textarea id="botCodeInput" placeholder="الصق كود البوت هنا اللي هتديه لليوزر"></textarea>`,`<button class="btn ghost" onclick="closeModal()">الغاء</button><button class="btn green" onclick="approveAPIBot('${reqId}','${uid}','${botName}','${gameName}')">ارسال الكود</button>`);
}
window.approveAPIBot=async(reqId,userId,botName,gameName)=>{
  const code = document.getElementById('botCodeInput').value.trim();
  if(!code) return showToast('لازم تحط كود البوت');
  await addDoc(collection(db,"bots"),{uid:userId,name:botName,gameName:gameName,status:"جاهز",code:code,createdAt:serverTimestamp()});
  await updateDoc(doc(db,"api_bot_requests",reqId),{status:'approved'});
  await addDoc(collection(db,"notifications"),{uid:userId,reason:`تمت الموافقة على بوت API ${botName}`,type:"api_bot_approved",time:serverTimestamp()});
  closeModal(); showToast(`✅ تم ارسال الكود لـ ${botName}`);
}
window.rejectAPIBot=async(reqId)=>{await updateDoc(doc(db,"api_bot_requests",reqId),{status:'rejected'});showToast('❌ تم رفض الطلب');}

window.approveAction=async(reqId,serverId,action)=>{const newStatus=action==='start'?'شغال':'متوقف';await updateDoc(doc(db,"servers",serverId),{status:newStatus,pendingAction:null,log:`> تم ${action==='start'?'تشغيل':'ايقاف'} بواسطة الادارة`});await updateDoc(doc(db,"action_requests",reqId),{status:'approved'});showToast('تمت الموافقة');}
window.rejectAction=async(reqId,serverId)=>{await updateDoc(doc(db,"servers",serverId),{pendingAction:null,log:'> تم رفض الطلب'});await updateDoc(doc(db,"action_requests",reqId),{status:'rejected'});showToast('تم الرفض');}

window.approveDelete=async(reqId,serverId,userId)=>{
  await deleteDoc(doc(db,"servers",serverId));
  await updateDoc(doc(db,"users",userId),{lastDeleteTime: serverTimestamp()});
  await updateDoc(doc(db,"delete_requests",reqId),{status:'approved'});
  showToast('تم الحذف');
}
window.rejectDelete=async(reqId)=>{await updateDoc(doc(db,"delete_requests",reqId),{status:'rejected'});showToast('تم الرفض');}

window.showTab=(t,btn)=>{
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  
  // اول ما تدوس على التاب نمسح الاشعار ونعلم الحاجات مقروءة
  if(t === 'users'){
    getDocs(collection(db,"users")).then(snap=>{
      snap.forEach(d=>{
        if(!d.data().isReadByAdmin){
          updateDoc(doc(db,"users",d.id),{isReadByAdmin:true})
        }
      })
    })
    updateTabBadge('users', 0);
  }
  if(t === 'support'){
    getDocs(query(collection(db,"support_messages"),where("read","==",false), where("sender","==","user"))).then(snap=>{
      snap.forEach(d=>{
        updateDoc(doc(db,"support_messages",d.id),{read:true})
      })
    })
    updateTabBadge('support', 0);
  }
  
  ['users','servers','bots','support','modReq','actionReq','botReq','apiBotReq','linkReq','deleteReq'].forEach(id=>document.getElementById(id).style.display=id==t?'block':'none');
}
window.adminLogin=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('adminEmail').value,document.getElementById('adminPass').value);showToast('تم الدخول');}catch(e){showToast('بيانات خاطئة');}}
window.logout=()=>signOut(auth);
</script>
