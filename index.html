<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highrise Bot Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#03040a; --card:#0a0f1a; --border:#1a2333; --text:#f0f4ff;--primary:#5b8def; --success:#10b981; --danger:#f43f5e; --admin:#a855f7; --glow:0 0 20px rgba(91,141,239,.4);}
  *{box-sizing:border-box;font-family:'Cairo',sans-serif}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1a2a4a 0%,transparent 60%),linear-gradient(180deg,#03040a,#050812);color:var(--text)}
.container{max-width:900px;margin:0 auto;padding:20px;animation:fadeIn.6s}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card{background:rgba(10,15,26,.6);backdrop-filter:blur(15px);border:1px solid var(--border);border-radius:22px;padding:25px;margin-bottom:20px}
  input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--border);background:#03040a;color:#fff;margin:10px 0;font-size:16px}
.btn{padding:14px 24px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--primary),#3b82f6);color:#fff;font-weight:900;cursor:pointer;transition:.3s}
.btn:hover{transform:translateY(-4px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.success{background:linear-gradient(135deg,var(--success),#059669)}.btn.danger{background:linear-gradient(135deg,var(--danger),#e11d48)}.btn.ghost{background:transparent;border:2px solid var(--border)}
.actions{display:flex;gap:10px}
.page{display:none}.page.active{display:block}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--success),#059669);color:#000;padding:16px 24px;border-radius:16px;z-index:999;font-weight:900;display:none}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:15px 20px;background:rgba(10,15,26,.6);border-radius:18px;border:1px solid var(--border)}
.buy-btn{background:linear-gradient(135deg,var(--admin),#9333ea);padding:10px 18px;border-radius:12px;text-decoration:none;color:#fff;font-weight:900}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header-actions{display:flex;gap:12px;align-items:center;position:relative}
.icon-btn{width:45px;height:45px;border-radius:50%;background:rgba(10,15,26,.8);border:2px solid var(--border);display:flex;justify-content:center;align-items:center;font-size:22px;cursor:pointer;position:relative}
.settings-menu{position:absolute;top:55px;left:0;background:rgba(10,15,26,.95);backdrop-filter:blur(20px);border:1px solid var(--primary);padding:18px;border-radius:16px;width:260px;display:none;z-index:100;text-align:right}
.settings-menu.show{display:block}
.bot-controls{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.status-badge{padding:8px 16px;border-radius:20px;font-weight:900;font-size:14px}
.status-badge.on{background:rgba(16,185,129,.2);color:var(--success);border:1px solid var(--success)}
.status-badge.off{background:rgba(244,63,94,.2);color:var(--danger);border:1px solid var(--danger)}
.status-badge.pending{background:rgba(245,158,11,.2);color:#f59e0b;border:1px solid #f59e0b}
.transfer-box{background:rgba(168,85,247,.1);border:1px dashed var(--admin);padding:15px;border-radius:14px;margin-top:15px}
.commands-box{background:rgba(91,141,239,.1);border:2px solid var(--primary);padding:20px;border-radius:16px;margin-top:20px}
.command-item{display:flex;justify-content:space-between;align-items:center;background:#03040a;padding:12px;border-radius:12px;margin:10px 0;border:1px solid var(--border)}
.copy-btn{background:var(--success);padding:8px 14px;border-radius:8px;border:none;color:#000;font-weight:900;cursor:pointer}
.updates-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);display:none;justify-content:center;align-items:center;z-index:9999}
.updates-modal.show{display:flex}
.updates-content{background:rgba(10,15,26,.9);backdrop-filter:blur(20px);border:2px solid var(--primary);border-radius:24px;width:90%;max-width:550px;height:75vh;display:flex;flex-direction:column}
.updates-header{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.updates-box{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:15px}
.update-msg{background:linear-gradient(135deg,var(--admin),#9333ea);width:100%;text-align:center;border-radius:16px;padding:16px;position:relative}
.update-msg img{max-width:100%;border-radius:12px;margin-top:10px}
.update-reactions{display:flex;gap:8px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.reaction-btn{padding:6px 12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);border-radius:20px;font-size:15px;cursor:pointer;font-weight:900;transition:.2s}
.reaction-btn.active{border-color:var(--primary);background:rgba(91,141,239,.4)}
.emoji-picker{position:absolute;background:rgba(10,15,26,.95);backdrop-filter:blur(10px);border:1px solid var(--primary);padding:10px;border-radius:14px;display:none;gap:10px;z-index:10000}
.loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;justify-content:center;align-items:center;z-index:10000}
.loader{width:70px;height:70px;border:5px solid var(--border);border-top:5px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div id="loadingScreen" class="loading-screen"><div class="loader"></div></div>
  <div class="toast" id="toast"></div>

<div class="container">
  <div class="top-bar"><h2 style="margin:0">Highrise Panel</h2><a href="https://high.rs/user?name=c203" target="_blank" class="buy-btn">TORKY - لشراء بوت</a></div>

  <div id="loginPage" class="page active">
    <div class="card" style="max-width:450px;margin:40px auto">
      <h2 style="text-align:center">تسجيل دخول</h2>
      <input id="loginEmail" type="email" placeholder="البريد الالكتروني">
      <input id="loginPassword" type="password" placeholder="كلمة السر">
      <div class="actions">
        <button class="btn" id="loginBtn" style="flex:1">دخول</button>
        <button class="btn ghost" id="goToSignupBtn" style="flex:1">انشاء حساب</button>
      </div>
    </div>
  </div>

  <div id="signupPage" class="page">
    <div class="card" style="max-width:450px;margin:40px auto">
      <h2 style="text-align:center">انشاء حساب جديد</h2>
      <input id="signupUsername" type="text" placeholder="اسم المستخدم">
      <input id="signupEmail" type="email" placeholder="البريد الالكتروني">
      <input id="signupPassword" type="password" placeholder="كلمة السر">
      <input id="signupConfirmPassword" type="password" placeholder="تأكيد كلمة السر">
      <div class="actions">
        <button class="btn" id="signupBtn" style="flex:1">انشاء</button>
        <button class="btn ghost" id="goToLoginBtn" style="flex:1">رجوع</button>
      </div>
    </div>
  </div>

  <div id="dashboardPage" class="page">
    <div class="card">
      <div class="header"><h2>لوحة التحكم</h2><div class="header-actions"><div class="icon-btn" id="updatesBtn">📢</div><div class="icon-btn" id="settingsBtn">⚙️</div><div class="settings-menu" id="settingsMenu"><p><b>مرحبا</b><br><span id="userName"></span></p><p style="font-size:13px;color:#aaa"><b>الايميل:</b><br><span id="userEmail"></span></p><button class="btn ghost" id="logoutBtn" style="width:100%">تسجيل خروج</button></div></div></div>

      <h3>🤖 البوت الخاص بك</h3>
      <div id="botSection"><p style="color:#aaa">لسه مفيش بوت. استنى الادمن يبعتهولك</p></div>

      <div class="commands-box" id="commandsBox" style="display:none">
        <h3>📜 اوامر البوت</h3>
        <div id="commandsList"></div>
      </div>
    </div>
  </div>
</div>

<div class="updates-modal" id="updatesModal"><div class="updates-content"><div class="updates-header"><h3 style="margin:0">📢 التحديثات</h3><button class="btn ghost" id="closeUpdatesBtn">اغلاق</button></div><div class="updates-box" id="updatesBox"></div></div></div>
<div class="emoji-picker" id="emojiPicker"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, addDoc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {apiKey: "AIzaSyC7nexX-dwj_IhYC5EaS-DU_YQeE6-acDw",authDomain: "game-af286.firebaseapp.com",projectId: "game-af286"};
  const app = initializeApp(firebaseConfig);const auth = getAuth();const db = getFirestore();
  let currentUser = null; let userData = {};

  const hideLoading = () => document.getElementById('loadingScreen').style.display='none';
  const showLoading = () => document.getElementById('loadingScreen').style.display='flex';
  const toast = (msg) => {const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
  const showPage = (id) => {document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}

  document.getElementById('goToSignupBtn').onclick = () => showPage('signupPage');
  document.getElementById('goToLoginBtn').onclick = () => showPage('loginPage');
  document.getElementById('loginBtn').onclick = signIn;
  document.getElementById('signupBtn').onclick = signUp;
  document.getElementById('logoutBtn').onclick = () => signOut(auth);
  document.getElementById('settingsBtn').onclick = (e) => {e.stopPropagation(); document.getElementById('settingsMenu').classList.toggle('show')};
  document.getElementById('updatesBtn').onclick = () => document.getElementById('updatesModal').classList.add('show');
  document.getElementById('closeUpdatesBtn').onclick = () => document.getElementById('updatesModal').classList.remove('show');
  document.addEventListener('click', () => document.getElementById('emojiPicker').classList.remove('show'));

  onAuthStateChanged(auth, async user => {
    if(user){
      const userDoc = await getDoc(doc(db,"users",user.uid));
      if(!userDoc.exists()){ await signOut(auth); hideLoading(); return; }
      if(userDoc.data().banned){ document.body.innerHTML=`<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column"><h1>⛔ تم حظرك</h1><p>${userDoc.data().banReason||''}</p></div>`; hideLoading(); return; }
      currentUser = user; userData = userDoc.data();
      document.getElementById('userName').innerText = userData.username;
      document.getElementById('userEmail').innerText = userData.email;
      showPage('dashboardPage');
      loadBot(); loadCommands(); loadUpdates();
    } else { showPage('loginPage'); }
    hideLoading();
  });

  function loadBot(){
    onSnapshot(doc(db,"users",currentUser.uid), snap => {
      if(!snap.exists()) return;
      const data = snap.data();
      const botSection = document.getElementById('botSection');
      if(data.botCode){
        const status = data.botStatus || 'متوقف';
        const statusClass = status === 'شغال'? 'on' : status === 'بانتظار الموافقة'? 'pending' : 'off';
        const isRunning = status === 'شغال';
        botSection.innerHTML = `
          <code style="background:#03040a;padding:14px;border-radius:12px;display:block;margin:12px 0;white-space:pre-wrap">${data.botCode}</code>
          <p><b>الحالة:</b> <span class="status-badge ${statusClass}">${status}</span></p>
          <div class="bot-controls">
            <button class="btn success" id="startBtn" onclick="requestBotAction('start')" ${isRunning?'disabled':''}>${isRunning?'✅ البوت شغال':'🚀 تشغيل'}</button>
            <button class="btn danger" id="stopBtn" onclick="requestBotAction('stop')" ${!isRunning?'disabled':''}>⏹️ ايقاف</button>
          </div>
          <div class="transfer-box"><h4>🔄 نقل البوت لغرفه اخرى</h4><input id="roomCodeInput" placeholder="الصق كود الغرفه هنا"><button class="btn" onclick="requestTransferBot()">ارسال طلب النقل</button></div>
        `;
      } else { botSection.innerHTML = `<p style="color:#aaa">لسه مفيش بوت. استنى الادمن يبعتهولك</p>`; }
    });
  }

  function loadCommands(){
    onSnapshot(doc(db,"users",currentUser.uid), snap => {
      const data = snap.data();
      const commands = data.botCommands || [];
      const box = document.getElementById('commandsBox');
      const list = document.getElementById('commandsList');
      if(commands.length > 0){
        box.style.display = 'block';
        list.innerHTML = '';
        commands.forEach((cmd,i) => {
          list.innerHTML += `<div class="command-item"><code>${cmd}</code><button class="copy-btn" onclick="copyCommand('${cmd.replace(/'/g,"\\'")}')">نسخ</button></div>`;
        });
      } else { box.style.display = 'none'; }
    });
  }

  window.copyCommand = (text) => {
    navigator.clipboard.writeText(text);
    toast('📋 تم نسخ الامر');
  }

  window.requestBotAction = async (action) => {
    if(action === 'start' && document.getElementById('startBtn')?.disabled){
      return toast('البوت شغال بالفعل');
    }
    await addDoc(collection(db,"bot_action_requests"),{uid: currentUser.uid, username: userData.username, action: action, status: 'pending', time: serverTimestamp()});
    await setDoc(doc(db,"users",currentUser.uid), {botStatus: 'بانتظار الموافقة'}, {merge:true});
    toast('✅ تم ارسال الطلب للادمن');
  }

  window.requestTransferBot = async () => {
    const roomCode = document.getElementById('roomCodeInput').value.trim();
    if(!roomCode) return toast('حط كود الغرفه');
    await addDoc(collection(db,"bot_transfer_requests"),{uid: currentUser.uid, username: userData.username, roomCode: roomCode, status: 'pending', time: serverTimestamp()});
    document.getElementById('roomCodeInput').value = '';
    toast('📨 تم ارسال طلب النقل');
  }

  function loadUpdates(){
    const q = query(collection(db,"updates"), orderBy("time","desc"));
    onSnapshot(q, snap => {
      const updatesBox = document.getElementById('updatesBox');
      updatesBox.innerHTML = '';
      snap.forEach(d => {
        const m = d.data(); const id = d.id; const reactions = m.reactions || {};
        let reactionsHtml = `<div class="update-reactions">`;
        ['👍','❤️','🔥','😂'].forEach(e => {
          const count = reactions[e]? reactions[e].length : 0;
          const active = reactions[e] && reactions[e].includes(currentUser.uid)? 'active' : '';
          reactionsHtml += `<div class="reaction-btn ${active}" onclick="addReaction('${id}','${e}')">${e} ${count}</div>`;
        });
        reactionsHtml += `</div>`;
        const msgDiv = document.createElement('div');
        msgDiv.className = 'update-msg';
        msgDiv.innerHTML = `<div>📢 ${m.username}</div><div>${m.text}</div>${m.image?`<img src="${m.image}">`:''}${reactionsHtml}`;
        let pressTimer;
        msgDiv.addEventListener('mousedown', (e) => { pressTimer = setTimeout(() => showEmojiPicker(e, id), 500); });
        msgDiv.addEventListener('mouseup', () => clearTimeout(pressTimer));
        msgDiv.addEventListener('touchstart', (e) => { pressTimer = setTimeout(() => showEmojiPicker(e, id), 500); });
        msgDiv.addEventListener('touchend', () => clearTimeout(pressTimer));
        updatesBox.appendChild(msgDiv);
      });
    });
  }

  function showEmojiPicker(e, msgId){
    const picker = document.getElementById('emojiPicker');
    picker.innerHTML = '';
    ['👍','❤️','🔥','😂'].forEach(emoji => {
      const btn = document.createElement('div'); btn.innerText = emoji; btn.style.fontSize = '24px'; btn.style.cursor = 'pointer';
      btn.onclick = () => {addReaction(msgId, emoji); picker.classList.remove('show')};
      picker.appendChild(btn);
    });
    picker.style.top = e.touches? e.touches[0].pageY + 'px' : e.pageY + 'px';
    picker.style.left = e.touches? e.touches[0].pageX + 'px' : e.pageX + 'px';
    picker.classList.add('show');
  }

  window.addReaction = async (msgId, emoji) => {
    const msgRef = doc(db,"updates",msgId);
    const msgSnap = await getDoc(msgRef);
    let reactions = msgSnap.data().reactions || {};
    if(!reactions[emoji]) reactions[emoji] = [];
    if(reactions[emoji].includes(currentUser.uid)){ reactions[emoji] = reactions[emoji].filter(uid => uid!== currentUser.uid); }
    else { reactions[emoji].push(currentUser.uid); }
    await updateDoc(msgRef, {reactions: reactions});
    document.getElementById('emojiPicker').classList.remove('show');
  }

  async function signIn(){ const email = document.getElementById('loginEmail').value; const password = document.getElementById('loginPassword').value; if(!email ||!password) return toast('املا كل الحقول'); showLoading(); try{ await signInWithEmailAndPassword(auth,email,password); }catch(e){ toast('خطأ: ' + e.message); hideLoading(); } }

  async function signUp(){
    const username = document.getElementById('signupUsername').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupConfirmPassword').value;
    if(!username ||!email ||!password) return toast('املا كل الحقول');
    if(password!== confirm) return toast('كلمة السر مش مطابقة');
    showLoading();
    try{
      const res = await createUserWithEmailAndPassword(auth,email,password);
      await setDoc(doc(db,"users",res.user.uid),{
        username,email,createdAt:serverTimestamp(),
        banned:false,isAdmin:false,botCode:"",botStatus:"متوقف",botCommands:[]
      });
      toast('✅ تم انشاء الحساب');
    }catch(e){
      if(e.code === 'auth/email-already-in-use'){
        toast('⚠️ الحساب موجود غير البريد');
      } else if(e.code === 'auth/weak-password'){
        toast('⚠️ كلمة السر ضعيفة لازم 6 حروف');
      } else if(e.code === 'auth/invalid-email'){
        toast('⚠️ البريد الالكتروني غير صحيح');
      } else {
        toast('خطأ: ' + e.message);
      }
      hideLoading();
    }
  }
</script>
</body>
</html>
