<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><title>لوحة تحكم Highrise ULTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070a;--card:#0f131b;--border:#1e2636;--text:#eef2fa;--primary:#4f7cff;--success:#22c55e;--danger:#ef4444;--warn:#f59e0b;--purple:#8b5cf6}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:radial-gradient(1000px 500px at 20% -10%,#16203a 0%,transparent 60%),var(--bg);color:var(--text);margin:0;padding:0}
.header{position:sticky;top:0;background:rgba(5,7,10,.8);backdrop-filter:blur(10px);padding:20px;border-bottom:1px solid var(--border);z-index:100}
.header h1{color:var(--primary);font-weight:900;margin:0;font-size:28px}
.container{padding:20px;max-width:1600px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:30px}
.stat-card{background:linear-gradient(135deg,#121827,#0d121b);border:1px solid var(--border);padding:25px;border-radius:20px;transition:.3s;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--primary),var(--purple))}
.stat-card:hover{transform:translateY(-5px);border-color:var(--primary);box-shadow:0 10px 40px rgba(79,124,255,.2)}
.stat-card h3{margin:0;font-size:14px;color:#aaa;font-weight:400}.stat-card p{margin:12px 0 0;font-size:38px;font-weight:900;color:var(--primary)}
.tabs{display:flex;gap:12px;margin-bottom:25px;flex-wrap:wrap;background:var(--card);padding:10px;border-radius:16px;border:1px solid var(--border)}
.tabs button{padding:12px 24px;background:transparent;border:none;color:#aaa;cursor:pointer;border-radius:12px;font-weight:700;transition:.3s;font-size:15px}
.tabs button:hover{color:var(--text);background:rgba(79,124,255,.1)}
.tabs button.active{background:var(--primary);color:white;box-shadow:0 4px 20px rgba(79,124,255,.4)}
.card{background:linear-gradient(180deg,#121827,#0d121b);border:1px solid var(--border);padding:20px;margin:14px 0;border-radius:18px;transition:.3s}
.card:hover{border-color:var(--primary);transform:translateX(-5px)}
.btn{padding:11px 18px;border:none;border-radius:12px;cursor:pointer;margin:5px;font-weight:800;transition:.2s;font-size:14px}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,.3)}
.btn.green{background:var(--success);color:#000}.btn.red{background:var(--danger);color:white}.btn.blue{background:var(--primary);color:white}.btn.orange{background:var(--warn);color:#000}.btn.purple{background:var(--purple);color:white}.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.toast{position:fixed;bottom:30px;right:30px;background:var(--success);color:#000;padding:16px 24px;border-radius:14px;display:none;font-weight:800;z-index:9999;box-shadow:0 10px 40px rgba(34,197,94,.4);animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.login-box{background:linear-gradient(180deg,#121827,#0d121b);padding:40px;border-radius:24px;max-width:450px;margin:100px auto;border:1px solid var(--border);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:#05070a;color:white;margin:10px 0;font-size:16px}
input:focus{outline:none;border-color:var(--primary)}
.req-item{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.req-info{flex:1}
a{color:var(--primary);word-break:break-all}
.user-actions{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800}
.badge.pending{background:rgba(245,158,11,.2);color:var(--warn)}.badge.on{background:rgba(34,197,94,.2);color:var(--success)}.badge.off{background:rgba(239,68,68,.2);color:var(--danger)}

/* مودال احترافي */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;justify-content:center;align-items:center;z-index:10000;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:linear-gradient(180deg,#121827,#0d121b);border:1px solid var(--primary);padding:30px;border-radius:24px;width:90%;max-width:550px;box-shadow:0 20px 80px rgba(79,124,255,.3)}
.modal-box h3{margin-top:0;color:var(--primary);font-size:22px;display:flex;align-items:center;gap:10px}
.modal-box textarea{width:100%;min-height:100px;background:#05070a;border:1px solid var(--border);color:white;border-radius:12px;padding:12px;margin:15px 0;font-family:'Cairo'}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
</style>
</head>
<body>
<div id="app">جاري التحميل...</div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalContent"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, where, getDocs, serverTimestamp, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyC7nexX-dwj_IhYC5EaS-DU_YQeE6-acDw",authDomain: "game-af286.firebaseapp.com",projectId: "game-af286"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
const ADMIN_EMAIL = "alaaahmedsayd16@gmail.com";

function showToast(msg){const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function showModal(icon,title,content,actions){document.getElementById('modalContent').innerHTML=`<h3>${icon} ${title}</h3>${content}<div class="modal-actions">${actions}</div>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}

onAuthStateChanged(auth, user => {
  const appDiv = document.getElementById('app');
  if(!user) {
    appDiv.innerHTML = `<div class="login-box"><h1 style="color:var(--primary)">🔐 دخول لوحة Highrise ULTRA</h1><input type="email" id="adminEmail" placeholder="ايميل Highrise" value="${ADMIN_EMAIL}"><input type="password" id="adminPass" placeholder="كلمة السر"><button class="btn blue" style="width:100%;margin-top:10px" onclick="adminLogin()">دخول</button></div>`;
    return;
  }
  if(user.email!== ADMIN_EMAIL){appDiv.innerHTML = `<div class="login-box"><h1>⛔ مش حساب Highrise</h1><button class="btn red" onclick="logout()">خروج</button></div>`; return;}
  loadAdminPanel();
});

function loadAdminPanel(){
  document.getElementById('app').innerHTML = `
  <div class="header"><h1>📊 لوحة تحكم Highrise ULTRA</h1><button class="btn red" onclick="logout()" style="position:absolute;left:20px;top:20px">خروج</button></div>
  <div class="container">
  <div class="stats">
    <div class="stat-card"><h3>عدد الحسابات</h3><p id="userCount">0</p></div>
    <div class="stat-card"><h3>عدد السيرفرات</h3><p id="serverCount">0</p></div>
    <div class="stat-card"><h3>عدد البوتات</h3><p id="botCount">0</p></div>
  </div>
  <div class="tabs">
    <button class="active" onclick="showTab('users',this)">👥 المستخدمين</button>
    <button onclick="showTab('servers',this)">🖥️ السيرفرات</button>
    <button onclick="showTab('bots',this)">🤖 البوتات</button>
    <button onclick="showTab('actionReq',this)">⚡ طلبات التشغيل</button>
    <button onclick="showTab('botReq',this)">🤖 طلبات البوتات</button>
    <button onclick="showTab('linkReq',this)">🔗 طلبات الروابط</button>
    <button onclick="showTab('deleteReq',this)">🗑️ طلبات الحذف</button>
  </div>
  <div id="users"></div><div id="servers" style="display:none"></div><div id="bots" style="display:none"></div>
  <div id="actionReq" style="display:none"></div><div id="botReq" style="display:none"></div>
  <div id="linkReq" style="display:none"></div><div id="deleteReq" style="display:none"></div>
  </div>`;
  loadUsers(); loadServers(); loadBots(); loadActionRequests(); loadBotRequests(); loadLinkRequests(); loadDeleteRequests();
}

function loadUsers(){
  onSnapshot(collection(db,"users"),(snap)=>{
    document.getElementById('userCount').innerText=snap.size;
    let html='<h2>ادارة المستخدمين</h2>';
    snap.forEach(d=>{const u=d.data();
      html+=`<div class="card req-item">
        <div class="req-info">
          <p><b>الاسم:</b> ${u.username || 'بدون اسم'}</p>
          <p><b>الايميل:</b> ${u.email}</p>
          <p><b>الحالة:</b> ${u.banned?`<span class="badge" style="background:rgba(239,68,68,.2);color:var(--danger)">🔨 محظور</span>`:`<span class="badge" style="background:rgba(34,197,94,.2);color:var(--success)">✅ شغال</span>`}</p>
        </div>
        <div class="user-actions">
          ${!u.banned?`<button class="btn orange" onclick="openWarnModal('${d.id}','${u.email}')">⚠️ تحذير</button>
          <button class="btn red" onclick="openBanModal('${d.id}','${u.email}','temp')">🚫 حظر</button>
          <button class="btn red" onclick="openBanModal('${d.id}','${u.email}','permanent')">🔨 بند نهائي</button>`:`
          <button class="btn green" onclick="unbanUser('${d.id}')">✅ فك الحظر</button>`}
          <button class="btn red" onclick="openDeleteUserModal('${d.id}','${u.email}')">🗑️ مسح</button>
        </div>
      </div>`;
    });
    document.getElementById('users').innerHTML=html||'<p>مفيش مستخدمين</p>';
  });
}

// ====== مودالات احترافية ======
window.openWarnModal=(uid,email)=>{
  showModal('⚠️',`تحذير المستخدم: ${email}`,`<p>اكتب سبب التحذير:</p><textarea id="warnReason" placeholder="مثال: مخالفة القوانين"></textarea>`,
  `<button class="btn ghost" onclick="closeModal()">الغاء</button><button class="btn orange" onclick="sendWarning('${uid}')">ارسال التحذير</button>`);
}
window.sendWarning=async(uid)=>{
  const reason=document.getElementById('warnReason').value.trim();if(!reason)return showToast('اكتب السبب');
  await addDoc(collection(db,"notifications"),{uid,reason,type:"warning",time:serverTimestamp()});
  closeModal();showToast('📢 تم ارسال تحذير للمستخدم');
}

window.openBanModal=(uid,email,type)=>{
  const t=type==='permanent'?'بند نهائي':'حظر مؤقت';
  showModal('🚫',`${t}: ${email}`,`<p>اكتب سبب الحظر:</p><textarea id="banReason" placeholder="سبب الحظر"></textarea>`,
  `<button class="btn ghost" onclick="closeModal()">الغاء</button><button class="btn red" onclick="doBan('${uid}','${type}')">تأكيد الحظر</button>`);
}
window.doBan=async(uid,type)=>{
  const reason=document.getElementById('banReason').value.trim();if(!reason)return showToast('اكتب السبب');
  await updateDoc(doc(db,"users",uid),{banned:true,banReason:reason});
  await addDoc(collection(db,"notifications"),{uid,reason,type:"ban",time:serverTimestamp()});
  closeModal();showToast('🚫 تم الحظر وارسال اشعار');
}

window.unbanUser=async(uid)=>{
  await updateDoc(doc(db,"users",uid),{banned:false,banReason:null});
  await addDoc(collection(db,"notifications"),{uid,reason:"تم فك الحظر عن حسابك",type:"unban",time:serverTimestamp()});
  showToast('✅ تم فك الحظر');
}

window.openDeleteUserModal=(uid,email)=>{
  showModal('🗑️',`مسح حساب: ${email}`,`<p style="color:var(--danger)">تحذير: سيتم مسح الحساب + كل السيرفرات + كل البوتات. الاجراء نهائي!</p>`,
  `<button class="btn ghost" onclick="closeModal()">الغاء</button><button class="btn red" onclick="deleteUserAccount('${uid}')">نعم امسح</button>`);
}
window.deleteUserAccount=async(uid)=>{
  const servers = await getDocs(query(collection(db,"servers"),where("uid","==",uid)));
  servers.forEach(s=>deleteDoc(doc(db,"servers",s.id)));
  const bots = await getDocs(query(collection(db,"bots"),where("uid","==",uid)));
  bots.forEach(b=>deleteDoc(doc(db,"bots",b.id)));
  await deleteDoc(doc(db,"users",uid));
  closeModal();showToast('🗑️ تم مسح الحساب بالكامل')
}

// باقي الاقسام بنفس الشكل الاحترافي
function loadServers(){
  onSnapshot(collection(db,"servers"),(snap)=>{
    document.getElementById('serverCount').innerText=snap.size;
    let html='<h2>كل السيرفرات</h2>';
    snap.forEach(d=>{const s=d.data();
      html+=`<div class="card req-item"><div class="req-info">
        <h3>${s.name}</h3>
        <p>الحالة: <span class="badge ${s.status==='شغال'?'on':s.pendingAction?'pending':'off'}">${s.pendingAction||s.status}</span></p>
        <p>النوع: ${s.type==='python'?'بايثون':'Node.js'} | المالك: ${s.uid}</p>
      </div><div>
        <button class="btn blue" onclick="editServerName('${d.id}','${s.name}')">✏️ تعديل</button>
        <button class="btn red" onclick="openDeleteServerModal('${d.id}','${s.name}')">🗑️ مسح</button>
      </div></div>`;
    });
    document.getElementById('servers').innerHTML=html||'<p>مفيش سيرفرات</p>';
  });
}
window.openDeleteServerModal=(id,name)=>{
  showModal('🗑️',`مسح السيرفر: ${name}`,`<p>متاكد عايز تمسح السيرفر ده نهائي؟</p>`,
  `<button class="btn ghost" onclick="closeModal()">الغاء</button><button class="btn red" onclick="deleteServer('${id}')">نعم امسح</button>`);
}
window.deleteServer=async(id)=>{await deleteDoc(doc(db,"servers",id));closeModal();showToast('تم المسح')}
window.editServerName=async(id,oldName)=>{const newName=prompt('الاسم الجديد:',oldName);if(newName){await updateDoc(doc(db,"servers",id),{name:newName});showToast('تم تعديل الاسم')}}

// البوتات + الطلبات بنفس النظام
function loadBots(){onSnapshot(collection(db,"bots"),(snap)=>{document.getElementById('botCount').innerText=snap.size;let html='<h2>كل البوتات</h2>';snap.forEach(d=>{const b=d.data();html+=`<div class="card req-item"><div class="req-info"><h3>${b.name}</h3><p>الحالة: <span class="badge ${b.status==='شغال'?'on':b.status==='قيد المراجعة'?'pending':'off'}">${b.status}</span></p><p>المالك: ${b.uid}</p></div><div><button class="btn purple" onclick="manageCommands('${d.id}','${b.name}')">⚙️ اوامر</button><button class="btn red" onclick="openDeleteBotModal('${d.id}','${b.name}')">🗑️ مسح</button></div></div>`});document.getElementById('bots').innerHTML=html||'<p>مفيش بوتات</p>';});}
window.openDeleteBotModal=(id,name)=>{showModal('🗑️',`مسح البوت: ${name}`,`<p>متاكد؟</p>`,`<button class="btn ghost" onclick="closeModal()">الغاء</button><button class="btn red" onclick="deleteBot('${id}')">نعم امسح</button>`);}
window.deleteBot=async(id)=>{await deleteDoc(doc(db,"bots",id));closeModal();showToast('تم مسح البوت')}
window.manageCommands=async(botId,botName)=>{let html=`<h3>ادارة اوامر: ${botName}</h3>`;const snap=await getDocs(query(collection(db,"bot_commands"),where("botId","==",botId)));html+='<div>';snap.forEach(c=>{html+=`<p>${c.data().command} <button class="btn red" style="padding:4px 8px" onclick="deleteCommand('${c.id}')">X</button></p>`});html+=`</div><input id="newCmd" placeholder="الامر الجديد"><button class="btn green" onclick="addCommand('${botId}')">➕ اضافة</button>`;showModal('⚙️','ادارة الاوامر',html,'<button class="btn ghost" onclick="closeModal()">اغلاق</button>');}
window.addCommand=async(botId)=>{const cmd=document.getElementById('newCmd').value.trim();if(!cmd)return;await addDoc(collection(db,"bot_commands"),{botId,command:cmd});showToast('تم اضافة الامر')}
window.deleteCommand=async(id)=>{await deleteDoc(doc(db,"bot_commands",id));showToast('تم المسح')}

function loadBotRequests(){onSnapshot(query(collection(db,"bot_requests"),where("status","==","pending")),(snap)=>{let html='<h2>طلبات البوتات</h2>';if(snap.empty) html+='<p>مفيش طلبات</p>';snap.forEach(d=>{const r=d.data();html+=`<div class="card req-item"><div class="req-info"><p><b>المستخدم:</b> ${r.userEmail}</p><p><b>البوت:</b> ${r.name}</p><p><b>Token:</b> ${r.token}</p><p><b>الغرفة:</b> ${r.room}</p></div><div><button class="btn green" onclick="approveBot('${d.id}','${r.uid}','${r.name}')">✅ موافقة 12س</button><button class="btn red" onclick="rejectBot('${d.id}')">❌ رفض</button></div></div>`});document.getElementById('botReq').innerHTML=html;});}
window.approveBot=async(reqId,userId,botName)=>{const expires=new Date();expires.setHours(expires.getHours()+12);const botRef=await addDoc(collection(db,"bots"),{uid:userId,name:botName,status:"شغال",createdAt:serverTimestamp(),expiresAt:Timestamp.fromDate(expires)});await updateDoc(doc(db,"bot_requests",reqId),{status:'approved',botId:botRef.id});await addDoc(collection(db,"notifications"),{uid:userId,reason:`تمت الموافقة على بوت ${botName} لمدة 12 ساعة`,type:"bot_approved",time:serverTimestamp()});showToast('✅ تمت الموافقة');}
window.rejectBot=async(reqId)=>{await updateDoc(doc(db,"bot_requests",reqId),{status:'rejected'});showToast('❌ تم الرفض');}

function loadActionRequests(){onSnapshot(query(collection(db,"action_requests"),where("status","==","pending")),(snap)=>{let html='<h2>طلبات التشغيل/الايقاف</h2>';if(snap.empty) html+='<p>مفيش طلبات</p>';snap.forEach(d=>{const r=d.data();html+=`<div class="card req-item"><div class="req-info"><p><b>المستخدم:</b> ${r.userEmail}</p><p><b>السيرفر:</b> ${r.serverName}</p><p><b>الطلب:</b> ${r.action==='start'?'تشغيل':'ايقاف'}</p></div><div><button class="btn green" onclick="approveAction('${d.id}','${r.serverId}','${r.action}')">✅ موافقة</button><button class="btn red" onclick="rejectAction('${d.id}','${r.serverId}')">❌ رفض</button></div></div>`});document.getElementById('actionReq').innerHTML=html;});}
window.approveAction=async(reqId,serverId,action)=>{const newStatus=action==='start'?'شغال':'متوقف';await updateDoc(doc(db,"servers",serverId),{status:newStatus,pendingAction:null,log:`> تم ${action==='start'?'تشغيل':'ايقاف'} بواسطة Highrise`});await updateDoc(doc(db,"action_requests",reqId),{status:'approved'});showToast('تمت الموافقة');}
window.rejectAction=async(reqId,serverId)=>{await updateDoc(doc(db,"servers",serverId),{pendingAction:null,log:'> تم رفض الطلب'});await updateDoc(doc(db,"action_requests",reqId),{status:'rejected'});showToast('تم الرفض');}

function loadLinkRequests(){onSnapshot(query(collection(db,"link_requests"),where("status","==","pending")),(snap)=>{let html='<h2>طلبات الروابط</h2>';if(snap.empty) html+='<p>مفيش طلبات</p>';snap.forEach(d=>{const r=d.data();html+=`<div class="card req-item"><div class="req-info"><p><b>المستخدم:</b> ${r.userEmail}</p><p><b>السيرفر:</b> ${r.serverName}</p><p><b>الرابط:</b> <a href="${r.link}" target="_blank">${r.link}</a></p></div><div><button class="btn green" onclick="approveLink('${d.id}')">✅ استلام</button><button class="btn red" onclick="rejectLink('${d.id}')">❌ رفض</button></div></div>`});document.getElementById('linkReq').innerHTML=html;});}
window.approveLink=async(id)=>{await updateDoc(doc(db,"link_requests",id),{status:'done'});showToast('تم الاعتماد')}
window.rejectLink=async(id)=>{await updateDoc(doc(db,"link_requests",id),{status:'rejected'});showToast('تم الرفض')}

function loadDeleteRequests(){onSnapshot(query(collection(db,"delete_requests"),where("status","==","pending")),(snap)=>{let html='<h2>طلبات حذف السيرفرات</h2>';if(snap.empty) html+='<p>مفيش طلبات</p>';snap.forEach(d=>{const r=d.data();html+=`<div class="card req-item"><div class="req-info"><p><b>المستخدم:</b> ${r.userEmail}</p><p><b>السيرفر:</b> ${r.serverName}</p><p><b>التاريخ:</b> ${r.time?.toDate().toLocaleString('ar-EG') || '---'}</p></div><div><button class="btn green" onclick="approveDelete('${d.id}','${r.serverId}','${r.uid}')">✅ موافقة ومسح</button><button class="btn red" onclick="rejectDelete('${d.id}')">❌ رفض</button></div></div>`});document.getElementById('deleteReq').innerHTML=html;});}
window.approveDelete=async(reqId,serverId,userId)=>{await deleteDoc(doc(db,"servers",serverId));await updateDoc(doc(db,"users",userId),{lastDeleteTime: serverTimestamp()});await updateDoc(doc(db,"delete_requests",reqId),{status:'approved'});showToast('تم المسح وتفعيل 7 ايام');}
window.rejectDelete=async(reqId)=>{await updateDoc(doc(db,"delete_requests",reqId),{status:'rejected'});showToast('تم الرفض');}

window.showTab=(t,btn)=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['users','servers','bots','actionReq','botReq','linkReq','deleteReq'].forEach(id=>document.getElementById(id).style.display=id==t?'block':'none');}
window.adminLogin=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('adminEmail').value,document.getElementById('adminPass').value);showToast('تم الدخول');}catch(e){showToast('بيانات غلط');}}
window.logout=()=>signOut(auth);
</script>
