<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><title>لوحة تحكم Highrise</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#05070a;color:#eef2fa;margin:0;padding:20px}
h1{color:#4f7cff;font-weight:900}
.stats{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:#0f131b;border:1px solid #1e2636;padding:20px;border-radius:16px;flex:1;min-width:200px}
.stat-card h3{margin:0;font-size:14px;color:#aaa}.stat-card p{margin:10px 0 0;font-size:32px;font-weight:900;color:#4f7cff}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{padding:12px 20px;background:#0f131b;border:1px solid #1e2636;color:white;cursor:pointer;border-radius:12px;font-weight:700}
.tabs button.active{background:#4f7cff;border-color:#4f7cff}
.card{background:#0f131b;border:1px solid #1e2636;padding:18px;margin:12px 0;border-radius:16px}
.btn{padding:10px 16px;border:none;border-radius:10px;cursor:pointer;margin:4px;font-weight:700}
.btn.green{background:#22c55e;color:#000}.btn.red{background:#ef4444;color:white}.btn.blue{background:#4f7cff;color:white}.btn.orange{background:#f59e0b;color:#000}
.toast{position:fixed;bottom:20px;right:20px;background:#22c55e;color:#000;padding:14px 20px;border-radius:12px;display:none;font-weight:700}
.login-box{background:#0f131b;padding:30px;border-radius:18px;max-width:420px;margin:100px auto;border:1px solid #1e2636;text-align:center}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #1e2636;background:#05070a;color:white;margin:8px 0}
.req-item{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.req-info{flex:1}
a{color:#4f7cff;word-break:break-all}
.user-actions{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">جاري التحميل...</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, where, getDocs, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyC7nexX-dwj_IhYC5EaS-DU_YQeE6-acDw",authDomain: "game-af286.firebaseapp.com",projectId: "game-af286"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
const ADMIN_EMAIL = "alaaahmedsayd16@gmail.com";

function showToast(msg){const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}

onAuthStateChanged(auth, user => {
  const appDiv = document.getElementById('app');
  if(!user) {
    appDiv.innerHTML = `<div class="login-box"><h1>🔐 دخول لوحة Highrise</h1><input type="email" id="adminEmail" placeholder="ايميل Highrise" value="${ADMIN_EMAIL}"><input type="password" id="adminPass" placeholder="كلمة السر"><button class="btn blue" onclick="adminLogin()">دخول</button></div>`;
    return;
  }
  if(user.email!== ADMIN_EMAIL){appDiv.innerHTML = `<div class="login-box"><h1>⛔ مش حساب Highrise</h1><button class="btn red" onclick="logout()">خروج</button></div>`; return;}
  loadAdminPanel();
});

function loadAdminPanel(){
  document.getElementById('app').innerHTML = `
  <h1>📊 لوحة تحكم Highrise</h1>
  <button class="btn red" onclick="logout()" style="float:left">خروج</button>
  <div class="stats">
    <div class="stat-card"><h3>عدد الحسابات</h3><p id="userCount">0</p></div>
    <div class="stat-card"><h3>عدد السيرفرات</h3><p id="serverCount">0</p></div>
  </div>
  <div class="tabs">
    <button class="active" onclick="showTab('users',this)">👥 المستخدمين</button>
    <button onclick="showTab('servers',this)">🖥️ السيرفرات</button>
    <button onclick="showTab('actionReq',this)">⚡ طلبات التشغيل/الايقاف</button>
    <button onclick="showTab('linkReq',this)">🔗 طلبات الروابط</button>
    <button onclick="showTab('deleteReq',this)">🗑️ طلبات الحذف</button>
  </div>
  <div id="users"></div>
  <div id="servers" style="display:none"></div>
  <div id="actionReq" style="display:none"></div>
  <div id="linkReq" style="display:none"></div>
  <div id="deleteReq" style="display:none"></div>
  `;
  loadUsers(); loadServers(); loadActionRequests(); loadLinkRequests(); loadDeleteRequests();
}

function loadUsers(){
  onSnapshot(collection(db,"users"),(snap)=>{
    document.getElementById('userCount').innerText=snap.size;
    let html='<h2>ادارة المستخدمين</h2>';
    snap.forEach(d=>{const u=d.data();
      html+=`<div class="card req-item">
        <div class="req-info">
          <p><b>الاسم:</b> ${u.username || 'بدون اسم'}</p>
          <p><b>الايميل:</b> ${u.email}</p>
          <p><b>الحالة:</b> ${u.banned?`<span style="color:red">محظور</span>`:`<span style="color:green">شغال</span>`}</p>
        </div>
        <div class="user-actions">
          ${!u.banned?`<button class="btn orange" onclick="banUser('${d.id}','${u.email}','warning')">⚠️ تحذير</button>
          <button class="btn red" onclick="banUser('${d.id}','${u.email}','temp')">🚫 حظر</button>
          <button class="btn red" onclick="banUser('${d.id}','${u.email}','permanent')">🔨 بند للابد</button>`:`
          <button class="btn green" onclick="unbanUser('${d.id}')">✅ فك الحظر</button>`}
          <button class="btn red" onclick="deleteUserAccount('${d.id}','${u.email}')">🗑️ مسح الحساب</button>
        </div>
      </div>`;
    });
    document.getElementById('users').innerHTML=html||'<p>مفيش مستخدمين</p>';
  });
}

window.banUser=async(uid,email,type)=>{
  let reason = prompt(`سبب ${type==='warning'?'التحذير':'الحظر'} ل ${email}:`);
  if(!reason) return;
  if(type==='warning'){await addDoc(collection(db,"notifications"),{uid,reason,type:"warning",time:serverTimestamp()});showToast('تم ارسال تحذير')}
  else{await updateDoc(doc(db,"users",uid),{banned:true,banReason:reason});showToast('تم الحظر')}
}

window.unbanUser=async(uid)=>{await updateDoc(doc(db,"users",uid),{banned:false,banReason:null});showToast('تم فك الحظر')}

window.deleteUserAccount=async(uid,email)=>{
  if(!confirm(`متاكد عايز تمسح حساب ${email} وكل سيرفراته؟`))return;
  const servers = await getDocs(query(collection(db,"servers"),where("uid","==",uid)));
  servers.forEach(s=>deleteDoc(doc(db,"servers",s.id)));
  await deleteDoc(doc(db,"users",uid));
  showToast('تم مسح الحساب')
}

function loadServers(){
  onSnapshot(collection(db,"servers"),(snap)=>{
    document.getElementById('serverCount').innerText=snap.size;
    let html='<h2>كل السيرفرات</h2>';
    snap.forEach(d=>{const s=d.data();
      html+=`<div class="card req-item"><div class="req-info">
        <h3 id="serverName-${d.id}">${s.name}</h3>
        <p>الحالة: ${s.status} ${s.pendingAction?` | ${s.pendingAction}`:''}</p>
        <p>المالك: ${s.uid}</p>
      </div><div>
        <button class="btn blue" onclick="editServerName('${d.id}','${s.name}')">✏️ تعديل الاسم</button>
        <button class="btn red" onclick="deleteServer('${d.id}')">🗑️ مسح السيرفر</button>
      </div></div>`;
    });
    document.getElementById('servers').innerHTML=html||'<p>مفيش سيرفرات</p>';
  });
}

window.editServerName=async(id,oldName)=>{
  const newName=prompt('الاسم الجديد:',oldName);
  if(newName) {await updateDoc(doc(db,"servers",id),{name:newName});showToast('تم تعديل الاسم')}
}
window.deleteServer=async(id)=>{if(confirm('متاكد؟')){await deleteDoc(doc(db,"servers",id));showToast('تم المسح')}}

function loadActionRequests(){
  onSnapshot(query(collection(db,"action_requests"),where("status","==","pending")),(snap)=>{
    let html='<h2>طلبات التشغيل والايقاف المعلقة</h2>';
    if(snap.empty) html+='<p>مفيش طلبات</p>';
    snap.forEach(d=>{const r=d.data();
      html+=`<div class="card req-item"><div class="req-info">
        <p><b>المستخدم:</b> ${r.userEmail}</p><p><b>السيرفر:</b> ${r.serverName}</p><p><b>الطلب:</b> ${r.action==='start'?'تشغيل':'ايقاف'}</p>
      </div><div>
        <button class="btn green" onclick="approveAction('${d.id}','${r.serverId}','${r.action}')">✅ موافقة</button>
        <button class="btn red" onclick="rejectAction('${d.id}','${r.serverId}')">❌ رفض</button>
      </div></div>`;
    });
    document.getElementById('actionReq').innerHTML=html;
  });
}
window.approveAction=async(reqId,serverId,action)=>{
  const newStatus=action==='start'?'شغال':'متوقف';
  await updateDoc(doc(db,"servers",serverId),{status:newStatus,pendingAction:null,log:`> تم ${action==='start'?'تشغيل':'ايقاف'} السيرفر بواسطة Highrise`});
  await updateDoc(doc(db,"action_requests",reqId),{status:'approved'});showToast('تمت الموافقة');
}
window.rejectAction=async(reqId,serverId)=>{
  await updateDoc(doc(db,"servers",serverId),{pendingAction:null,log:'> تم رفض الطلب بواسطة Highrise'});
  await updateDoc(doc(db,"action_requests",reqId),{status:'rejected'});showToast('تم الرفض');
}

function loadLinkRequests(){
  onSnapshot(query(collection(db,"link_requests"),where("status","==","pending")),(snap)=>{
    let html='<h2>طلبات الروابط المعلقة</h2>';
    if(snap.empty) html+='<p>مفيش طلبات</p>';
    snap.forEach(d=>{const r=d.data();
      html+=`<div class="card req-item"><div class="req-info">
        <p><b>المستخدم:</b> ${r.userEmail}</p><p><b>السيرفر:</b> ${r.serverName}</p><p><b>الرابط:</b> <a href="${r.link}" target="_blank">${r.link}</a></p>
      </div><div>
        <button class="btn green" onclick="approveLink('${d.id}')">✅ تم الاستلام</button>
        <button class="btn red" onclick="rejectLink('${d.id}')">❌ رفض</button>
      </div></div>`;
    });
    document.getElementById('linkReq').innerHTML=html;
  });
}
window.approveLink=async(id)=>{await updateDoc(doc(db,"link_requests",id),{status:'done'});showToast('تم اعتماد الرابط')}
window.rejectLink=async(id)=>{await updateDoc(doc(db,"link_requests",id),{status:'rejected'});showToast('تم رفض الرابط')}

// ====== طلبات الحذف الجديدة ======
function loadDeleteRequests(){
  onSnapshot(query(collection(db,"delete_requests"),where("status","==","pending")),(snap)=>{
    let html='<h2>طلبات حذف السيرفرات - كل 7 ايام</h2>';
    if(snap.empty) html+='<p>مفيش طلبات حذف</p>';
    snap.forEach(d=>{const r=d.data();
      html+=`<div class="card req-item"><div class="req-info">
        <p><b>المستخدم:</b> ${r.userEmail}</p>
        <p><b>السيرفر:</b> ${r.serverName}</p>
        <p><b>تاريخ الطلب:</b> ${r.time?.toDate().toLocaleString('ar-EG') || '---'}</p>
      </div><div>
        <button class="btn green" onclick="approveDelete('${d.id}','${r.serverId}','${r.uid}')">✅ موافقة ومسح</button>
        <button class="btn red" onclick="rejectDelete('${d.id}')">❌ رفض</button>
      </div></div>`;
    });
    document.getElementById('deleteReq').innerHTML=html;
  });
}

window.approveDelete=async(reqId,serverId,userId)=>{
  if(!confirm('متاكد عايز تمسح السيرفر ده؟')) return;
  // 1. امسح السيرفر
  await deleteDoc(doc(db,"servers",serverId));
  // 2. حدث وقت اخر حذف للمستخدم عشان الكول داون 7 ايام
  await updateDoc(doc(db,"users",userId),{lastDeleteTime: serverTimestamp()});
  // 3. اقفل الطلب
  await updateDoc(doc(db,"delete_requests",reqId),{status:'approved'});
  showToast('تم مسح السيرفر وتفعيل الكول داون 7 ايام');
}

window.rejectDelete=async(reqId)=>{
  await updateDoc(doc(db,"delete_requests",reqId),{status:'rejected'});
  showToast('تم رفض طلب الحذف');
}
// ====== نهاية طلبات الحذف ======

window.showTab=(t,btn)=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['users','servers','actionReq','linkReq','deleteReq'].forEach(id=>document.getElementById(id).style.display=id==t?'block':'none');}
window.adminLogin=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('adminEmail').value,document.getElementById('adminPass').value);showToast('تم الدخول');}catch(e){showToast('بيانات غلط');}}
window.logout=()=>signOut(auth);
</script>
</body>
</html>
