<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highrise Bot | TORKY</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#03040a; --card:#0a0f1a; --border:#1a2333; --text:#f0f4ff;
    --primary:#5b8def; --success:#10b981; --danger:#f43f5e; --admin:#a855f7;
    --glow:0 0 15px rgba(91,141,239,.3);
  }
  [data-theme="light"]{
    --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0; --text:#0f172a;
    --primary:#2563eb; --glow:0 0 15px rgba(37,99,235,.15);
  }
  [data-theme="blue"]{
    --bg:#0c1120; --card:#131b30; --border:#1e293b; --text:#e0f2fe;
    --primary:#38bdf8; --glow:0 0 15px rgba(56,189,248,.3);
  }

  *{box-sizing:border-box;font-family:'Cairo',sans-serif}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(91,141,239,.1) 0%,transparent 60%),linear-gradient(180deg,var(--bg),#000);color:var(--text);transition:.3s; font-size:14px}

.container{max-width:1000px;margin:0 auto;padding:20px;animation:fadeIn.6s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:var(--glow);transition:.3s}
.card:hover{transform:translateY(-3px)}

  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin:8px 0;font-size:14px;transition:.2s}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,141,239,.2)}

.btn{padding:11px 20px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--primary),#3b82f6);color:#fff;font-weight:800;cursor:pointer;transition:.3s;font-size:14px}
.btn:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.success{background:linear-gradient(135deg,var(--success),#059669)}
.btn.danger{background:linear-gradient(135deg,var(--danger),#e11d48)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.orange{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000}

.actions{display:flex;gap:10px}
.page{display:none}.page.active{display:block}

.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--success),#059669);color:#000;padding:12px 20px;border-radius:12px;z-index:999;font-weight:900;display:none;box-shadow:0 8px 30px rgba(0,0,0,.3); font-size:14px}

.top-bar{position:sticky;top:15px;z-index:50;display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;padding:12px 20px;background:var(--card);border-radius:16px;border:1px solid var(--border);box-shadow:var(--glow)}
.top-bar h2{font-size:20px;margin:0}
.top-right{display:flex;gap:12px;align-items:center}

.header-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--primary);cursor:pointer;transition:.3s}
.header-avatar:hover{transform:scale(1.1);border-color:var(--admin)}

.buy-btn{background:linear-gradient(135deg,var(--admin),#9333ea);padding:10px 16px;border-radius:12px;text-decoration:none;color:#fff;font-weight:900;transition:.3s; font-size:13px}
.buy-btn:hover{transform:scale(1.05)}

.theme-switcher{display:flex;gap:6px}
.theme-btn{width:30px;height:30px;border-radius:8px;border:2px solid var(--border);cursor:pointer;transition:.2s}
.theme-btn.active{border-color:var(--primary);transform:scale(1.1)}
.theme-dark{background:#03040a}
.theme-light{background:#f8fafc}
.theme-blue{background:#38bdf8}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h2{font-size:22px}
.header-actions{display:flex;gap:10px;align-items:center;position:relative}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;justify-content:center;align-items:center;font-size:20px;cursor:pointer;position:relative;transition:.3s}
.icon-btn:hover{border-color:var(--primary);transform:rotate(10deg)}
.notification-dot{position:absolute;top:6px;right:6px;width:10px;height:10px;background:var(--danger);border-radius:50%;border:2px solid var(--card);display:none}

.settings-menu{position:absolute;top:50px;left:0;background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--primary);padding:18px;border-radius:16px;width:280px;display:none;z-index:100;text-align:right;max-height:80vh;overflow-y:auto;box-shadow:0 15px 50px rgba(0,0,0,.4)}
.settings-menu.show{display:block}

.bot-grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width: 992px){.bot-grid{grid-template-columns: 1fr 1fr;} }

.bot-controls{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.status-badge{padding:8px 14px;border-radius:20px;font-weight:900;font-size:13px;display:inline-block}
.status-badge.on{background:rgba(16,185,129,.2);color:var(--success);border:1px solid var(--success)}
.status-badge.off{background:rgba(244,63,94,.2);color:var(--danger);border:1px solid var(--danger)}
.status-badge.pending{background:rgba(245,158,11,.2);color:#f59e0b;border:1px solid #f59e0b}

.transfer-box{background:rgba(168,85,247,.1);border:1px dashed var(--admin);padding:16px;border-radius:14px;margin-top:16px}
.commands-box{background:rgba(91,141,239,.1);border:1px solid var(--primary);padding:18px;border-radius:16px}
.command-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:12px;border-radius:12px;margin:10px 0;border:1px solid var(--border);transition:.2s}
.command-item:hover{border-color:var(--primary)}
.command-code{background:var(--primary);padding:5px 10px;border-radius:8px;font-weight:900;color:#000;display:inline-block; font-size:13px}
.copy-btn{background:var(--success);padding:10px 14px;border-radius:10px;border:none;color:#000;font-weight:900;cursor:pointer; font-size:13px}

.updates-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);display:none;justify-content:center;align-items:center;z-index:9999}
.updates-modal.show{display:flex}
.updates-content{background:var(--card);border:1px solid var(--primary);border-radius:20px;width:90%;max-width:550px;height:75vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.updates-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.updates-box{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.update-msg{background:linear-gradient(135deg,var(--admin),#9333ea);width:100%;text-align:center;border-radius:14px;padding:14px;position:relative;font-size:14px}
.update-msg img{max-width:100%;border-radius:10px;margin-top:10px}

.loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;justify-content:center;align-items:center;z-index:10000}
.loader{width:60px;height:60px;border:5px solid var(--border);border-top:5px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

.profile-pic{width:70px;height:70px;border-radius:50%;object-fit:cover;margin:10px auto;display:block;border:3px solid var(--primary);box-shadow:var(--glow)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:900;background:rgba(91,141,239,.2);border:1px solid var(--primary)}
.warning-box{background:rgba(244,63,94,.15);border:1px solid var(--danger);padding:12px;border-radius:12px;margin:12px 0;color:var(--danger);font-weight:700; font-size:13px}
  h2,h3{font-weight:900}
  h3{font-size:16px}
  hr{border:none;border-top:1px solid var(--border);margin:15px 0}

  @media (max-width: 768px){
 .container{padding:15px}
 .card{padding:16px}
 .top-bar{padding:12px 15px}
 .top-bar h2{font-size:18px}
 .header-avatar{width:36px;height:36px}
  }
</style>
</head>
<body>
  <div id="loadingScreen" class="loading-screen"><div class="loader"></div></div>
  <div class="toast" id="toast"></div>

<div class="container">
  <div class="top-bar">
    <h2>🚀 Highrise TORKY</h2>
    <div class="top-right">
      <div class="theme-switcher">
        <div class="theme-btn theme-dark active" onclick="setTheme('dark')" title="داكن"></div>
        <div class="theme-btn theme-light" onclick="setTheme('light')" title="فاتح"></div>
        <div class="theme-btn theme-blue" onclick="setTheme('blue')" title="ازرق"></div>
      </div>
      <img id="headerAvatar" class="header-avatar" src="https://i.imgur.com/8Km9tLL.png" onclick="document.getElementById('settingsBtn').click()">
      <a href="https://high.rs/user?name=c203" target="_blank" class="buy-btn">TORKY</a>
    </div>
  </div>

  <div id="loginPage" class="page active">
    <div class="card" style="max-width:420px;margin:50px auto">
      <h2 style="text-align:center;margin-bottom:20px;font-size:22px">تسجيل الدخول</h2>
      <input id="loginEmail" type="email" placeholder="البريد الالكتروني">
      <input id="loginPassword" type="password" placeholder="كلمة السر">
      <div class="actions"><button class="btn" id="loginBtn" style="flex:1">دخول</button><button class="btn ghost" id="goToSignupBtn" style="flex:1">انشاء حساب</button></div>
    </div>
  </div>

  <div id="signupPage" class="page">
    <div class="card" style="max-width:420px;margin:50px auto">
      <h2 style="text-align:center;margin-bottom:20px;font-size:22px">انشاء حساب جديد</h2>
      <input id="signupUsername" type="text" placeholder="اسم المستخدم">
      <input id="signupEmail" type="email" placeholder="البريد الالكتروني">
      <input id="signupPassword" type="password" placeholder="كلمة السر">
      <input id="signupConfirmPassword" type="password" placeholder="تأكيد كلمة السر">
      <div class="actions"><button class="btn" id="signupBtn" style="flex:1">انشاء</button><button class="btn ghost" id="goToLoginBtn" style="flex:1">رجوع</button></div>
    </div>
  </div>

  <div id="dashboardPage" class="page">
    <div class="card">
      <div class="header">
        <h2>لوحة التحكم</h2>
        <div class="header-actions">
          <div class="icon-btn" id="updatesBtn">📢<span class="notification-dot" id="notifDot"></span></div>
          <div class="icon-btn" id="settingsBtn">⚙️</div>
          <div class="settings-menu" id="settingsMenu">
            <img id="profilePic" class="profile-pic" src="https://i.imgur.com/8Km9tLL.png">
            <input type="file" id="picUpload" accept="image/*">
            <p><b>مرحبا</b><br><span id="userName" style="font-size:16px"></span></p>
            <div class="badges" id="userBadges"></div>
            <p style="font-size:12px;color:#aaa"><b>الايميل:</b><br><span id="userEmail"></span></p>
            <input id="newUsername" placeholder="اسم مستخدم جديد">
            <button class="btn orange" onclick="updateProfile()">تحديث الاسم</button>
            <hr>
            <p><b>🔒 تغيير كلمة السر</b></p>
            <input id="oldPassword" type="password" placeholder="كلمة السر القديمة">
            <input id="newPassword" type="password" placeholder="كلمة سر جديدة">
            <input id="confirmNewPassword" type="password" placeholder="تأكيد كلمة السر الجديدة">
            <button class="btn orange" onclick="updatePassword()">تغيير الباسورد</button>
            <button class="btn ghost" id="logoutBtn" style="width:100%;margin-top:12px">تسجيل خروج</button>
          </div>
        </div>
      </div>

      <div id="warningSection"></div>

      <div class="bot-grid">
        <div class="card" style="background:rgba(91,141,239,.05);margin:0">
          <h3>🤖 البوت الخاص بك</h3>
          <div id="botSection"><p style="color:#aaa">لسه مفيش بوت. استنى الادمن يبعتهولك</p></div>
        </div>
        <div class="commands-box" id="commandsBox" style="display:none;margin:0">
          <h3>📜 اوامر البوت</h3>
          <div id="commandsList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="updates-modal" id="updatesModal">
  <div class="updates-content">
    <div class="updates-header"><h3 style="margin:0;font-size:18px">📢 مركز التحديثات</h3><button class="btn ghost" id="closeUpdatesBtn">اغلاق</button></div>
    <div class="updates-box" id="updatesBox"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword as fbUpdatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, addDoc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {apiKey: "AIzaSyC7nexX-dwj_IhYC5EaS-DU_YQeE6-acDw",authDomain: "game-af286.firebaseapp.com",projectId: "game-af286"};
  const app = initializeApp(firebaseConfig);const auth = getAuth();const db = getFirestore();
  let currentUser = null; let userData = {}; let lastUpdateTime = 0;

  window.setTheme = (theme) => {
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector(`.theme-${theme}`).classList.add('active');
  }
  setTheme(localStorage.getItem('theme') || 'dark');

  const hideLoading = () => document.getElementById('loadingScreen').style.display='none';
  const showLoading = () => document.getElementById('loadingScreen').style.display='flex';
  const toast = (msg) => {const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
  const showPage = (id) => {document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}

  document.getElementById('goToSignupBtn').onclick = () => showPage('signupPage');
  document.getElementById('goToLoginBtn').onclick = () => showPage('loginPage');
  document.getElementById('loginBtn').onclick = signIn;
  document.getElementById('signupBtn').onclick = signUp;
  document.getElementById('logoutBtn').onclick = () => signOut(auth);

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsMenu = document.getElementById('settingsMenu');
  settingsBtn.onclick = (e) => {e.stopPropagation(); settingsMenu.classList.toggle('show')};
  settingsMenu.onclick = (e) => e.stopPropagation();
  document.addEventListener('click', () => settingsMenu.classList.remove('show'));

  document.getElementById('updatesBtn').onclick = () => {document.getElementById('updatesModal').classList.add('show'); document.getElementById('notifDot').style.display='none'};
  document.getElementById('closeUpdatesBtn').onclick = () => document.getElementById('updatesModal').classList.remove('show');
  document.getElementById('picUpload').onchange = uploadPic;

  onAuthStateChanged(auth, async user => {
    if(user){
      const userDoc = await getDoc(doc(db,"users",user.uid));
      if(!userDoc.exists()){ await signOut(auth); hideLoading(); return; }
      if(userDoc.data().banned){ document.body.innerHTML=`<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column"><h1>⛔ تم حظرك</h1><p>${userDoc.data().banReason||''}</p></div>`; hideLoading(); return; }
      currentUser = user; userData = userDoc.data();
      document.getElementById('userName').innerText = userData.username;
      document.getElementById('userEmail').innerText = userData.email;
      const pic = userData.photoURL || 'https://i.imgur.com/8Km9tLL.png';
      document.getElementById('profilePic').src = pic;
      document.getElementById('headerAvatar').src = pic;
      loadBadges(userData.badges || []);
      if(userData.warning){document.getElementById('warningSection').innerHTML = `<div class="warning-box">⚠️ تحذير من الادارة: ${userData.warning}</div>`}
      showPage('dashboardPage');
      loadBot(); loadCommands(); loadUpdates();
    } else { showPage('loginPage'); }
    hideLoading();
  });

  function loadBadges(badges){
    const names = {daily:'🔥 دخول يومي', deal:'💎 تعامل', active:'🚀 تحسينات', mod:'🛡 مشرف'};
    document.getElementById('userBadges').innerHTML = badges.map(b=>`<span class="badge">${names[b]||b}</span>`).join('');
  }

  async function uploadPic(e){
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      await updateDoc(doc(db,"users",currentUser.uid),{photoURL: ev.target.result});
      document.getElementById('profilePic').src = ev.target.result;
      document.getElementById('headerAvatar').src = ev.target.result;
      toast('✅ تم تحديث الصورة');
    }
    reader.readAsDataURL(file);
  }
  window.updateProfile = async () => {
    const name = document.getElementById('newUsername').value.trim();
    if(!name) return toast('حط اسم جديد');
    await updateDoc(doc(db,"users",currentUser.uid),{username:name});
    toast('✅ تم تحديث الاسم');
  }
  window.updatePassword = async () => {
    const oldPass = document.getElementById('oldPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmNewPassword').value;
    if(!oldPass ||!newPass ||!confirmPass) return toast('املا كل الخانات');
    if(newPass!== confirmPass) return toast('كلمة السر الجديدة مش مطابقة');
    if(newPass.length < 6) return toast('الباسورد الجديد لازم 6 حروف على الاقل');
    showLoading();
    try {
        const credential = EmailAuthProvider.credential(currentUser.email, oldPass);
        await reauthenticateWithCredential(currentUser, credential);
        await fbUpdatePassword(currentUser, newPass);
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmNewPassword').value = '';
        toast('✅ تم تغيير الباسورد بنجاح');
    } catch(e) {
        if(e.code === 'auth/wrong-password'){ toast('⚠️ كلمة السر القديمة غلط'); }
        else { toast('خطأ: ' + e.message); }
    }
    hideLoading();
  }

  function loadBot(){
    onSnapshot(doc(db,"users",currentUser.uid), snap => {
      if(!snap.exists()) return;
      const data = snap.data();
      const botSection = document.getElementById('botSection');
      if(data.botCode){
        const status = data.botStatus || 'متوقف';
        const statusClass = status === 'شغال'? 'on' : status === 'بانتظار الموافقة'? 'pending' : 'off';
        const isRunning = status === 'شغال';
        botSection.innerHTML = `<code style="background:var(--bg);padding:12px;border-radius:12px;display:block;margin:12px 0;white-space:pre-wrap;border:1px solid var(--border);font-size:13px">${data.botCode}</code><p><b>الحالة:</b> <span class="status-badge ${statusClass}">${status}</span></p><div class="bot-controls"><button class="btn success" id="startBtn" onclick="requestBotAction('start')" ${isRunning?'disabled':''}>${isRunning?'✅ شغال':'🚀 تشغيل'}</button><button class="btn danger" id="stopBtn" onclick="requestBotAction('stop')" ${!isRunning?'disabled':''}>⏹️ ايقاف</button></div><div class="transfer-box"><h4>🔄 نقل البوت</h4><input id="roomCodeInput" placeholder="كود الغرفه"><button class="btn" onclick="requestTransferBot()">ارسال</button></div>`;
      } else { botSection.innerHTML = `<p style="color:#aaa">لسه مفيش بوت. استنى الادمن يبعتهولك</p>`; }
    });
  }

  function loadCommands(){onSnapshot(doc(db,"users",currentUser.uid), snap => {const data = snap.data();const commands = data.botCommands || [];const box = document.getElementById('commandsBox');const list = document.getElementById('commandsList');if(commands.length > 0){box.style.display = 'block';list.innerHTML = '';commands.forEach((cmd) => {const parts = cmd.split(' - ');const commandCode = parts[0];const commandDesc = parts[1] || '';list.innerHTML += `<div class="command-item"><div><span class="command-code">${commandCode}</span><p style="margin:6px 0 0;color:#aaa;font-size:13px">${commandDesc}</p></div><button class="copy-btn" onclick="copyCommand('${commandCode}')">نسخ</button></div>`;});} else { box.style.display = 'none'; } });}
  window.copyCommand = (text) => {navigator.clipboard.writeText(text);toast('📋 تم النسخ: ' + text);}
  window.requestBotAction = async (action) => {if(action === 'start' && document.getElementById('startBtn')?.disabled){return toast('البوت شغال بالفعل');}await addDoc(collection(db,"bot_action_requests"),{uid: currentUser.uid,username: userData.username,action: action,status: 'pending',createdAt: serverTimestamp()});await setDoc(doc(db,"users",currentUser.uid), {botStatus: 'بانتظار الموافقة'}, {merge:true});toast('✅ تم ارسال الطلب للادمن');}
  window.requestTransferBot = async () => {const roomCode = document.getElementById('roomCodeInput').value.trim();if(!roomCode) return toast('حط كود الغرفه');await addDoc(collection(db,"bot_transfer_requests"),{uid: currentUser.uid, username: userData.username, roomCode: roomCode, status: 'pending', time: serverTimestamp()});document.getElementById('roomCodeInput').value = '';toast('📨 تم ارسال طلب النقل');}

  function loadUpdates(){
    const q = query(collection(db,"updates"), orderBy("time","desc"));
    onSnapshot(q, snap => {
      const updatesBox = document.getElementById('updatesBox');
      let firstLoad = lastUpdateTime === 0;
      updatesBox.innerHTML = '';
      snap.forEach(d => {
        const m = d.data();
        const updateTime = m.time?.toMillis() || 0;
        if(!firstLoad && updateTime > lastUpdateTime){
          document.getElementById('notifDot').style.display='block';
          toast('📢 تحديث جديد');
        }
        if(updateTime > lastUpdateTime) lastUpdateTime = updateTime;
        const adminBadge = m.username === 'الادارة'? ' 🛡' : '';
        const msgDiv = document.createElement('div');
        msgDiv.className = 'update-msg';
        msgDiv.innerHTML = `<div style="font-weight:900">${m.username}${adminBadge}</div><div style="margin-top:8px">${m.text}</div>${m.image?`<img src="${m.image}">`:''}`;
        updatesBox.appendChild(msgDiv);
      });
    }); // <-- كان ناقص القوس ده
  }

  async function signIn(){
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    if(!email ||!password) return toast('املا كل الحقول');
    showLoading();
    try{ await signInWithEmailAndPassword(auth,email,password); }
    catch(e){
      if(e.code === 'auth/invalid-credential'){ toast('⚠️ الايميل او كلمة السر غلط') }
      else if(e.code === 'auth/user-not-found'){ toast('⚠️ الحساب ده مش موجود') }
      else { toast('خطأ: ' + e.message); }
      hideLoading();
    }
  }

  async function signUp(){
    const username = document.getElementById('signupUsername').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupConfirmPassword').value;
    if(!username ||!email ||!password) return toast('املا كل الحقول');
    if(password!== confirm) return toast('كلمة السر مش مطابقة');
    showLoading();
    try{
      const res = await createUserWithEmailAndPassword(auth,email,password);
      await setDoc(doc(db,"users",res.user.uid),{username,email,createdAt:serverTimestamp(),banned:false,isAdmin:false,botCode:"",botStatus:"متوقف",botCommands:[],photoURL:"",badges:[]});
      toast('✅ تم انشاء الحساب');
    }catch(e){toast('خطأ: ' + e.message);hideLoading();}
  }
</script>
</body>
</html>
